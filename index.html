<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Erteki 🛍️</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#faf8f1;
  color:#292929
}

header{
  padding:20px 12px;
  text-align:center;
  background:linear-gradient(135deg,#fff,#fff4c9,#fff);
  border-bottom:2px solid #d4af37;
  box-shadow:0 5px 25px #c9a22730
}

.logo{
  font-size:36px;
  font-weight:bold;
  background:linear-gradient(90deg,#765300,#d4af37,#fff0a0,#d4af37,#765300);
  -webkit-background-clip:text;
  color:transparent
}

.subtitle{
  color:#777;
  margin-top:5px;
  font-size:13px
}

.top{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:14px
}

button{
  cursor:pointer
}

.top button,
.lang button{
  padding:9px 13px;
  border:1px solid #d4af37;
  border-radius:12px;
  background:#fff8dc;
  color:#765700;
  font-weight:bold
}

.lang{
  margin-top:10px
}

.lang button.active{
  background:#d4af37;
  color:#fff
}

.search{
  padding:15px 10px
}

.search input,
.admin input,
.admin select{
  width:100%;
  padding:12px;
  border:1px solid #d4af37;
  border-radius:12px;
  background:white;
  font-size:14px;
  margin:5px 0
}

.title{
  padding:8px 12px;
  color:#806000;
  font-size:19px;
  font-weight:bold
}

.line{
  width:40px;
  height:3px;
  margin-top:5px;
  background:#d4af37;
  border-radius:5px
}

.categories{
  display:flex;
  gap:8px;
  padding:0 10px 18px;
  overflow-x:auto
}

.category{
  min-width:110px;
  padding:12px 7px;
  text-align:center;
  border:1px solid #d4af37;
  border-radius:16px;
  background:linear-gradient(145deg,#fff,#fff5d4);
  color:#765700;
  font-weight:bold;
  font-size:12px
}

.category span{
  display:block;
  font-size:25px;
  margin-bottom:5px
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  padding:0 10px 20px
}

.product{
  background:white;
  padding:8px;
  border-radius:12px;
  border:1px solid #ead9a0;
  box-shadow:0 3px 10px #0000000d
}

.product img,
.no-image{
  width:90px;
  height:90px;
  object-fit:contain;
  display:block;
  margin:auto;
  border-radius:10px
}

.no-image{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff8dc;
  font-size:35px
}

.product h3{
  margin:6px 0 3px;
  font-size:13px
}

.product p{
  color:#777;
  font-size:10px;
  line-height:1.3
}

.price{
  color:#b8860b;
  font-size:14px;
  font-weight:bold
}

.gold{
  width:100%;
  padding:10px;
  margin-top:6px;
  border:0;
  border-radius:9px;
  background:linear-gradient(110deg,#765300,#c9a227,#ffe68a,#c9a227,#765300);
  color:white;
  font-weight:bold
}

.page,
.admin{
  display:none;
  padding:15px 10px
}

.box,
.cart-item,
.admin-product,
.order{
  background:white;
  padding:14px;
  margin-bottom:12px;
  border:1px solid #ead9a0;
  border-radius:16px
}

.back{
  width:100%;
  padding:11px;
  border:1px solid #d4af37;
  border-radius:12px;
  background:white;
  color:#765700;
  font-weight:bold
}

.qty{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  margin-top:10px
}

.qty button{
  width:36px;
  height:36px;
  border:1px solid #d4af37;
  border-radius:9px;
  background:#fff5ce;
  font-size:18px
}

.remove{
  width:100%;
  padding:9px;
  margin-top:9px;
  border:0;
  border-radius:9px;
  background:#fff0f0;
  color:#a33
}

.total{
  padding:15px;
  border-radius:14px;
  background:#fff3c4;
  border:1px solid #d4af37;
  font-size:18px;
  font-weight:bold;
  color:#765700;
  margin-bottom:10px
}

.admin-login{
  max-width:400px;
  margin:40px auto
}

.admin-login input{
  width:100%;
  padding:13px;
  border:1px solid #d4af37;
  border-radius:12px;
  margin:7px 0
}

.admin-error{
  color:#c0392b;
  text-align:center;
  font-size:13px;
  margin:8px
}

.small{
  padding:8px 10px;
  border:1px solid #d4af37;
  border-radius:9px;
  background:#fff6d4;
  color:#765700;
  margin:3px
}

.status{
  padding:8px;
  margin-top:8px;
  border-radius:9px;
  background:#fff3c4;
  color:#765700;
  text-align:center;
  font-weight:bold
}

.empty{
  text-align:center;
  padding:30px;
  background:white;
  border-radius:15px;
  color:#888
}

@media(min-width:700px){
  .products{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>

<body>

<header>

<div class="logo">Erteki ✨</div>

<div class="subtitle">
Türkmenistan üçin onlaýn söwda
</div>

<div class="top">

<button onclick="openCart()">
🛒 Sebet <span id="count">0</span>
</button>

<button onclick="openAdminLogin()">
🔐 Admin
</button>

</div>

<div class="lang">

<button id="tkBtn" onclick="setLanguage('tk')">
🇹🇲 TKM
</button>

<button id="ruBtn" onclick="setLanguage('ru')">
🇷🇺 РУС
</button>

</div>

</header>

<div id="home">

<div class="search">
<input
id="search"
placeholder="🔍 Haryt gözle..."
oninput="searchProducts()">
</div>

<div class="title">
<span id="catTitle">Kategoriýalar</span>
<div class="line"></div>
</div>

<div id="categories" class="categories"></div>

<div class="title">
<span id="popularTitle">Meşhur harytlar</span>
<div class="line"></div>
</div>

<div id="products" class="products"></div>

</div>

<div id="categoryPage" class="page">

<div class="title">
<span id="categoryName"></span>
<div class="line"></div>
</div>

<div id="categoryProducts" class="products"></div>

<button class="back" onclick="homePage()">
← Yza
</button>

</div>

<div id="cartPage" class="page">

<div class="title">
🛒 Sebet
<div class="line"></div>
</div>

<div id="cartItems"></div>

<div class="total">
Jemi: <span id="total">0</span> TMT
</div>

<button class="gold" onclick="openOrder()">
📦 Sargyt et
</button>

<button class="back" onclick="homePage()">
← Yza
</button>

</div>

<div id="orderPage" class="page">

<div class="title">
📦 Sargyt maglumatlary
<div class="line"></div>
</div>

<div class="box">

<input id="customerName" placeholder="Adyňyz">

<input id="customerPhone" placeholder="Telefon belgiňiz (+993...)">

<input id="customerAddress" placeholder="Salgyňyz">

<button class="gold" onclick="sendOrder()">
✅ Sargydy tassykla
</button>

</div>

<button class="back" onclick="openCart()">
← Sebede dolan
</button>

</div>

<div id="adminLoginPage" class="page">

<div class="admin-login">

<div class="title">
🔐 Admin giriş
<div class="line"></div>
</div>

<input
id="adminPassword"
type="password"
placeholder="Admin paroly">

<div id="adminError" class="admin-error"></div>

<button class="gold" onclick="checkAdmin()">
🔓 Giriş
</button>

<button class="back" onclick="homePage()">
← Yza
</button>

</div>

</div>

<div id="adminPage" class="admin">

<div class="title">
🔐 Admin panel
<div class="line"></div>
</div>

<div class="box">

<h3>📂 Kategoriýa goş</h3>

<input id="catName" placeholder="Kategoriýanyň ady">

<input id="catIcon" placeholder="Emoji: 🎁">

<button class="gold" onclick="addCategory()">
➕ Kategoriýa goş
</button>

</div>

<div id="adminCategories"></div>

<div class="box">

<h3>➕ Haryt goş</h3>

<input id="pName" placeholder="Harydyň ady">

<input id="pPrice" type="number" placeholder="Bahasy">

<input id="pDescription" placeholder="Düşündiriş">

<select id="pCategory"></select>

<button class="gold" onclick="addProduct()">
✨ Haryt goş
</button>

</div>

<div class="title">
📦 Harytlar
<div class="line"></div>
</div>

<div id="adminProducts"></div>

<div class="title">
📋 Sargytlar
<div class="line"></div>
</div>

<div id="orders"></div>

<button class="back" onclick="homePage()">
← Esasy sahypa
</button>

</div>

<script>

const ADMIN_PASSWORD="1972ejemjan";

let categories=JSON.parse(
localStorage.getItem("categories")
)||[
{id:"gift",name:"Sowgatlar",nameRu:"Подарки",icon:"🎁"},
{id:"beauty",name:"Gözellik we saç",nameRu:"Красота и волосы",icon:"💇‍♀️"},
{id:"home",name:"Öý üçin harytlar",nameRu:"Товары для дома",icon:"🏠"}
];

let products=JSON.parse(
localStorage.getItem("products")
)||[
{
id:1,
name:"Teddy Mişka 30sm",
nameRu:"Мишка Тедди 30см",
price:110,
description:"Sowgat üçin owadan mişka 🧸",
descriptionRu:"Красивая игрушка 🧸",
category:"gift",
image:""
},
{
id:2,
name:"Owadan Suwenir",
nameRu:"Красивый сувенир",
price:65,
description:"Ajaýyp sowgatlyk suwenir ✨",
descriptionRu:"Красивый сувенир ✨",
category:"gift",
image:""
},
{
id:3,
name:"Gije çyrasy Aý",
nameRu:"Ночник Луна",
price:90,
description:"Aý şekilli gije çyrasy 🌙",
descriptionRu:"Красивая лунная лампа 🌙",
category:"gift",
image:""
},
{
id:4,
name:"Saç üçin styler",
nameRu:"Стайлер для волос",
price:250,
description:"Saç üçin amatly",
descriptionRu:"Удобный стайлер",
category:"beauty",
image:""
},
{
id:5,
name:"Fen-darak",
nameRu:"Фен-расчёска",
price:180,
description:"Saç düzmek üçin",
descriptionRu:"Для укладки волос",
category:"beauty",
image:""
},
{
id:6,
name:"Termos",
nameRu:"Термос",
price:150,
description:"Gündelik ulanmak üçin",
descriptionRu:"Для ежедневного использования",
category:"home",
image:""
}
];

let orders=JSON.parse(
localStorage.getItem("orders")
)||[];

let cart=[];
let currentLanguage=
localStorage.getItem("language")||"tk";

function save(){

localStorage.setItem(
"categories",
JSON.stringify(categories)
);

localStorage.setItem(
"products",
JSON.stringify(products)
);

localStorage.setItem(
"orders",
JSON.stringify(orders)
);

}

function hideAll(){

document.getElementById("home").style.display="none";
document.getElementById("categoryPage").style.display="none";
document.getElementById("cartPage").style.display="none";
document.getElementById("orderPage").style.display="none";
document.getElementById("adminLoginPage").style.display="none";
document.getElementById("adminPage").style.display="none";

}

function homePage(){

hideAll();

document.getElementById("home").style.display="block";

renderCategories();
renderProducts();

}

function openAdminLogin(){

hideAll();

document.getElementById("adminLoginPage").style.display="block";

document.getElementById("adminPassword").value="";

document.getElementById("adminError").innerText="";

}

function checkAdmin(){

let password=
document.getElementById("adminPassword").value;

if(password===ADMIN_PASSWORD){

hideAll();

document.getElementById("adminPage").style.display="block";

renderAdmin();

}else{

document.getElementById("adminError").innerText=
"❌ Parol nädogry";

}

}

function renderCategories(){

let box=
document.getElementById("categories");

box.innerHTML="";

categories.forEach(c=>{

let div=document.createElement("div");

div.className="category";

div.innerHTML=
`<span>${c.icon}</span>
${currentLanguage==="ru"?c.nameRu:c.name}`;

div.onclick=()=>openCategory(c.id);

box.appendChild(div);

});

}

function renderProducts(list=products){

let box=
document.getElementById("products");

box.innerHTML="";

if(!list.length){

box.innerHTML=
`<div class="empty">Haryt tapylmady</div>`;

return;

}

list.forEach(p=>{

let div=document.createElement("div");

div.className="product";

let name=
currentLanguage==="ru"
?p.nameRu
:p.name;

let desc=
currentLanguage==="ru"
?p.descriptionRu
:p.description;

div.innerHTML=`

${p.image
?`<img src="${p.image}">`
:`<div class="no-image">🛍️</div>`}

<h3>${name}</h3>

<p>${desc}</p>

<div class="price">
${p.price} TMT
</div>

<button class="gold">
🛒 Sebede goş
</button>
`;

div.querySelector("button").onclick=()=>addToCart(p.id);

box.appendChild(div);

});

}

function searchProducts(){

let q=
document.getElementById("search")
.value
.toLowerCase();

renderProducts(
products.filter(p=>
p.name.toLowerCase().includes(q)||
p.nameRu.toLowerCase().includes(q)
)
);

}

function openCategory(id){

hideAll();

document.getElementById("categoryPage").style.display="block";

let cat=categories.find(c=>c.id===id);

document.getElementById("categoryName").innerText=
currentLanguage==="ru"
?cat.nameRu
:cat.name;

let list=
products.filter(p=>p.category===id);

let box=
document.getElementById("categoryProducts");

box.innerHTML="";

list.forEach(p=>{

let div=document.createElement("div");

div.className="product";

let name=
currentLanguage==="ru"?p.nameRu:p.name;

div.innerHTML=`

${p.image
?`<img src="${p.image}">`
:`<div class="no-image">🛍️</div>`}

<h3>${name}</h3>

<div class="price">${p.price} TMT</div>

<button class="gold">
🛒 Sebede goş
</button>
`;

div.querySelector("button").onclick=
()=>addToCart(p.id);

box.appendChild(div);

});

}

function addToCart(id){

let item=cart.find(x=>x.id===id);

if(item){

item.qty++;

}else{

cart.push({
id:id,
qty:1
});

}

updateCartCount();

}

function updateCartCount(){

document.getElementById("count").innerText=
cart.reduce((sum,x)=>sum+x.qty,0);

}

function openCart(){

hideAll();

document.getElementById("cartPage").style.display="block";

renderCart();

}

function renderCart(){

let box=
document.getElementById("cartItems");

box.innerHTML="";

if(!cart.length){

box.innerHTML=
`<div class="empty">🛒<br><br>Sebet boş</div>`;

document.getElementById("total").innerText="0";

return;

}

let total=0;

cart.forEach(item=>{

let p=products.find(x=>x.id===item.id);

if(!p)return;

total+=p.price*item.qty;

let div=document.createElement("div");

div.className="cart-item";

div.innerHTML=`

<strong>
${currentLanguage==="ru"?p.nameRu:p.name}
</strong>

<div>
${p.price} TMT
</div>

<div class="qty">

<button>-</button>

<span>${item.qty}</span>

<button>+</button>

</div>

<button class="remove">
Aýyr
</button>
`;

let buttons=div.querySelectorAll(".qty button");

buttons[0].onclick=()=>{
item.qty--;

if(item.qty<=0){

cart=cart.filter(x=>x.id!==item.id);

}

renderCart();
updateCartCount();

};

buttons[1].onclick=()=>{
item.qty++;
renderCart();
updateCartCount();
};

div.querySelector(".remove").onclick=()=>{

cart=cart.filter(x=>x.id!==item.id);

renderCart();
updateCartCount();

};

box.appendChild(div);

});

document.getElementById("total").innerText=total;

}

function openOrder(){

if(!cart.length){

alert("Sebet boş 🛒");

return;

}

hideAll();

document.getElementById("orderPage").style.display="block";

}

function sendOrder(){

let name=
document.getElementById("customerName").value.trim();

let phone=
document.getElementById("customerPhone").value.trim();

let address=
document.getElementById("customerAddress").value.trim();

if(!name||!phone||!address){

alert("Ähli maglumatlary dolduryň.");

return;

}

let total=0;

let items=cart.map(item=>{

let p=products.find(x=>x.id===item.id);

total+=p.price*item.qty;

return{
name:p.name,
qty:item.qty,
price:p.price
};

});

orders.unshift({

id:Date.now(),

customer:name,

phone:phone,

address:address,

items:items,

total:total,

status:"accepted",

date:new Date().toLocaleString(),

seen:false

});

save();

cart=[];

updateCartCount();

document.getElementById("customerName").value="";
document.getElementById("customerPhone").value="";
document.getElementById("customerAddress").value="";

alert("✅ Sargydyňyz kabul edildi!");

homePage();

}

function addCategory(){

let name=
document.getElementById("catName").value.trim();

let icon=
document.getElementById("catIcon").value.trim()||"📦";

if(!name){

alert("Kategoriýanyň adyny ýazyň.");

return;

}

categories.push({

id:"cat_"+Date.now(),

name:name,

nameRu:name,

icon:icon

});

save();

document.getElementById("catName").value="";
document.getElementById("catIcon").value="";

renderAdmin();

}

function addProduct(){

let name=
document.getElementById("pName").value.trim();

let price=
Number(document.getElementById("pPrice").value);

let description=
document.getElementById("pDescription").value.trim();

let category=
document.getElementById("pCategory").value;

if(!name||!price||!category){

alert("Harydyň maglumatlaryny dolduryň.");

return;

}

products.push({

id:Date.now(),

name:name,

nameRu:name,

price:price,

description:description,

descriptionRu:description,

category:category,

image:""

});

save();

document.getElementById("pName").value="";
document.getElementById("pPrice").value="";
document.getElementById("pDescription").value="";

renderAdmin();

}

function renderAdmin(){

renderAdminCategories();
renderSelect();
renderAdminProducts();
renderOrders();

}

function renderAdminCategories(){

let box=
document.getElementById("adminCategories");

box.innerHTML="";

categories.forEach(c=>{

let div=document.createElement("div");

div.className="admin-product";

div.innerHTML=`

<strong>
${c.icon} ${c.name}
</strong>

<br>

<button class="small">
❌ Aýyr
</button>
`;

div.querySelector("button").onclick=()=>{

if(products.some(p=>p.category===c.id)){

alert("Bu kategoriýada haryt bar.");

return;

}

categories=
categories.filter(x=>x.id!==c.id);

save();

renderAdmin();

};

box.appendChild(div);

});

}

function renderSelect(){

let select=
document.getElementById("pCategory");

select.innerHTML="";

categories.forEach(c=>{

let option=document.createElement("option");

option.value=c.id;

option.textContent=
c.icon+" "+
(currentLanguage==="ru"?c.nameRu:c.name);

select.appendChild(option);

});

}

function renderAdminProducts(){

let box=
document.getElementById("adminProducts");

box.innerHTML="";

products.forEach(p=>{

let div=document.createElement("div");

div.className="admin-product";

div.innerHTML=`

<strong>${p.name}</strong>

<div>${p.price} TMT</div>

<div>${p.description||""}</div>

<button class="small">
❌ Aýyr
</button>
`;

div.querySelector("button").onclick=()=>{

if(confirm("Harydy aýyrmalymy?")){

products=
products.filter(x=>x.id!==p.id);

save();

renderAdmin();

}

};

box.appendChild(div);

});

}

function renderOrders(){

let box=
document.getElementById("orders");

box.innerHTML="";

if(!orders.length){

box.innerHTML=
`<div class="empty">Häzirlikçe sargyt ýok.</div>`;

return;

}

orders.forEach(o=>{

let div=document.createElement("div");

div.className="order";

let items=o.items.map(i=>
`${i.name} × ${i.qty}`
).join("<br>");

div.innerHTML=`

<strong>📦 Sargyt #${o.id}</strong>

<p>
👤 ${o.customer}<br>
📞 ${o.phone}<br>
📍 ${o.address}
</p>

<div>
${items}
</div>

<div class="price">
Jemi: ${o.total} TMT
</div>

<div class="status">
${o.status}
</div>

`;

box.appendChild(div);

});

}

function setLanguage(lang){

currentLanguage=lang;

localStorage.setItem("language",lang);

document.getElementById("tkBtn")
.classList.toggle("active",lang==="tk");

document.getElementById("ruBtn")
.classList.toggle("active",lang==="ru");

document.getElementById("catTitle").innerText=
lang==="ru"?"Категории":"Kategoriýalar";

document.getElementById("popularTitle").innerText=
lang==="ru"?"Популярные товары":"Meşhur harytlar";

document.getElementById("search").placeholder=
lang==="ru"
?"🔍 Поиск товара..."
:"🔍 Haryt gözle...";

renderCategories();
renderProducts();

}

homePage();

setLanguage(currentLanguage);

</script>

</body>
</html>
