<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Erteki 🛍️</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#faf8f1;
  color:#292929
}

button,input,select,textarea{font-family:inherit}

header{
  padding:20px 12px;
  text-align:center;
  background:linear-gradient(135deg,#fff,#fff4c9,#fff);
  border-bottom:2px solid #d4af37;
  box-shadow:0 5px 25px #c9a22730
}

.logo{
  font-size:36px;
  font-weight:bold;
  background:linear-gradient(90deg,#765300,#d4af37,#fff0a0,#d4af37,#765300);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent
}

.subtitle{
  color:#777;
  margin-top:5px;
  font-size:13px
}

.top{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:14px;
  flex-wrap:wrap
}

.top button{
  padding:10px 13px;
  border:1px solid #c9a227;
  border-radius:25px;
  background:#fff8dc;
  color:#765700;
  font-weight:bold;
  cursor:pointer
}

.lang{margin-top:10px}

.lang button{
  padding:7px 10px;
  border:1px solid #d4af37;
  border-radius:9px;
  background:#fff6d4;
  color:#765700;
  margin:2px;
  font-size:11px;
  cursor:pointer
}

.lang button.active{
  background:#d4af37;
  color:#fff
}

.search{padding:15px 10px}

.search input{
  width:100%;
  padding:12px;
  border:1px solid #d4af37;
  border-radius:12px;
  background:white;
  font-size:14px;
  outline:none
}

.title{
  padding:8px 12px;
  color:#806000;
  font-size:19px;
  font-weight:bold
}

.line{
  width:40px;
  height:3px;
  margin-top:5px;
  background:#d4af37;
  border-radius:5px
}

.categories{
  display:flex;
  gap:8px;
  padding:0 10px 18px;
  overflow-x:auto
}

.category{
  min-width:110px;
  padding:12px 7px;
  text-align:center;
  border:1px solid #d4af37;
  border-radius:16px;
  background:linear-gradient(145deg,#fff,#fff5d4);
  color:#765700;
  font-weight:bold;
  font-size:12px;
  cursor:pointer
}

.category span{
  display:block;
  font-size:25px;
  margin-bottom:5px
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  padding:0 10px 20px
}

.product{
  background:white;
  padding:8px;
  border-radius:12px;
  border:1px solid #ead9a0;
  box-shadow:0 3px 10px #0000000d;
  overflow:hidden
}

.product img{
  width:100%;
  height:130px;
  object-fit:contain;
  border-radius:10px;
  display:block;
  background:#fff
}

.no-image{
  width:100%;
  height:130px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:#fff8dc;
  font-size:45px
}

.product h3{
  margin:7px 0 3px;
  font-size:13px
}

.product p{
  color:#777;
  font-size:10px;
  margin:3px 0;
  min-height:27px
}

.price{
  color:#b8860b;
  font-size:14px;
  font-weight:bold
}

.gold{
  width:100%;
  padding:10px 3px;
  margin-top:7px;
  border:0;
  border-radius:9px;
  background:linear-gradient(110deg,#765300,#c9a227,#ffe68a,#c9a227,#765300);
  color:white;
  font-size:11px;
  font-weight:bold;
  cursor:pointer
}

.page,.admin{
  display:none;
  padding:15px 10px
}

.cart-item,
.admin-box,
.admin-product,
.order,
.region-card{
  background:white;
  padding:14px;
  margin-bottom:12px;
  border:1px solid #ead9a0;
  border-radius:16px;
  box-shadow:0 4px 15px #0000000a
}

.qty{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-top:10px
}

.qty button{
  width:36px;
  height:36px;
  border:1px solid #d4af37;
  border-radius:9px;
  background:#fff5ce;
  font-size:19px;
  cursor:pointer
}

.remove{
  width:100%;
  padding:9px;
  margin-top:9px;
  border:0;
  border-radius:9px;
  background:#fff0f0;
  color:#a33;
  cursor:pointer
}

.total{
  padding:15px;
  border-radius:14px;
  background:#fff3c4;
  border:1px solid #d4af37;
  font-size:18px;
  font-weight:bold;
  color:#765700;
  margin-bottom:10px
}

.back{
  width:100%;
  padding:11px;
  margin-top:8px;
  border:1px solid #d4af37;
  border-radius:12px;
  background:white;
  color:#765700;
  font-weight:bold;
  cursor:pointer
}

.admin input,
.admin select,
.admin textarea,
.admin-box input,
.admin-box select,
.admin-box textarea{
  width:100%;
  padding:12px;
  border:1px solid #d4af37;
  border-radius:12px;
  background:white;
  font-size:14px;
  margin:5px 0;
  outline:none
}

.admin textarea,
.admin-box textarea{
  min-height:80px;
  resize:vertical
}

.admin-product img{
  width:90px;
  height:90px;
  object-fit:contain;
  display:block;
  margin:auto;
  border-radius:12px
}

.small{
  padding:8px 10px;
  border:1px solid #d4af37;
  border-radius:9px;
  background:#fff6d4;
  color:#765700;
  margin-top:5px;
  font-size:11px;
  cursor:pointer
}

.danger{
  border-color:#d66;
  background:#fff0f0;
  color:#a33
}

.empty{
  text-align:center;
  padding:35px 15px;
  background:white;
  border:1px solid #ead9a0;
  border-radius:16px;
  color:#888
}

.status-badge{
  display:inline-block;
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  margin:6px 0
}

.status-accepted{
  background:#fff3c4;
  color:#8a6d00
}

.status-onway{
  background:#dceeff;
  color:#0b5aa3
}

.status-delivered{
  background:#dcf5e0;
  color:#1e7d34
}

.status-cancelled{
  background:#ffe0e0;
  color:#a33
}

.status-buttons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
  margin-top:10px
}

.status-btn{
  padding:9px 4px;
  border:1px solid #d4af37;
  border-radius:9px;
  background:#fff;
  color:#555;
  font-size:11px;
  font-weight:bold;
  cursor:pointer
}

.status-btn.current{
  border:2px solid #765700;
  background:#fff3c4;
  color:#765700
}

#toastBox{
  position:fixed;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  z-index:9999;
  width:92%;
  max-width:360px
}

.toast{
  padding:12px 14px;
  margin-bottom:8px;
  border-radius:12px;
  color:#fff;
  font-size:13px;
  font-weight:bold;
  box-shadow:0 6px 20px #0003;
  animation:toast .25s ease
}

.toast.success{background:#2e9e4f}
.toast.error{background:#c0392b}

@keyframes toast{
  from{opacity:0;transform:translateY(-10px)}
  to{opacity:1;transform:translateY(0)}
}

.field-error{
  color:#c0392b;
  font-size:11px;
  min-height:14px
}

.delivery-info{
  padding:12px;
  margin:10px 0;
  border:1px solid #d4af37;
  border-radius:14px;
  background:#fff8dc;
  color:#765700;
  font-size:13px;
  line-height:1.6
}

.admin-section-title{
  color:#765700;
  margin-top:8px
}

.order-item{
  padding:7px 0;
  border-bottom:1px solid #eee;
  font-size:12px
}

.order-item:last-child{border-bottom:0}

@media(max-width:380px){
  .logo{font-size:31px}
}
</style>
</head>

<div id="adminCategories"></div>


<div class="admin-box">

➕ Haryt goş

type="number"
placeholder="Bahasy">

placeholder="Türkmençe düşündiriş"></textarea>

<textarea id="pDescriptionRu"
placeholder="Rusça düşündiriş"></textarea>

<select id="pCategory"></select>

<input
id="pImage"
type="file"
accept="image/*"
onchange="readImage(event)">

id="preview"
style="display:none;width:90px;height:90px;object-fit:contain;border-radius:12px;margin:8px auto">

<button class="gold" onclick="addProduct()">
✨ Haryt goş
</button>

<div class="title">
📦 Harytlar

</div>

</div>

<div id="orders"></div>


<button class="back" onclick="homePage()">

</div>

/* =========================
   STORAGE SAVE
========================= */

function saveAll(){

localStorage.setItem(
"erteki_categories",
JSON.stringify(categories)
);

localStorage.setItem(
"erteki_products",
JSON.stringify(products)
);

localStorage.setItem(
"erteki_regions",
JSON.stringify(regions)
);

localStorage.setItem(
"erteki_orders",

);

}


/* =========================
   TOAST
========================= */

function toast(message,type="success"){

const box=document.getElementById("toastBox");

const div=document.createElement("div");

div.className="toast "+type;

div.textContent=message;

box.appendChild(div);

setTimeout(()=>{
div.remove();
},2500);

}


/* =========================
   PAGE CONTROL
========================= */

function hidePages(){

document.getElementById("home").style.display="none";

document.getElementById("categoryPage").style.display="none";

document.getElementById("cartPage").style.display="none";

document.getElementById("orderPage").style.display="none";

document.getElementById("adminPage").style.display="none";

}


function homePage(){

hidePages();

document.getElementById("home").style.display="block";

renderCategories();

renderProducts();

}


function openCart(){

hidePages();

document.getElementById("cartPage").style.display="block";

renderCart();

}


function openOrder(){

if(cart.length===0){

toast(tr("emptyCart"),"error");

return;

}

hidePages();

document.getElementById("orderPage").style.display="block";

renderRegions();

updateDeliveryPrice();

}


/* =========================
   LANGUAGE
========================= */

function setLanguage(lang){

currentLanguage=lang;

localStorage.setItem("language",lang);

document.documentElement.lang=lang;

applyTranslations();

renderCategories();

renderProducts();

renderCart();

renderRegions();

renderAdmin();

}


function applyTranslations(){

document.getElementById("subtitle").textContent=tr("subtitle");

document.getElementById("search").placeholder=tr("search");

/* =========================

========================= */

function renderCategories(){

const box=document.getElementById("categories");

box.innerHTML="";

categories.forEach(cat=>{

const name=currentLanguage==="ru"
?cat.nameRu
:cat.name;

const div=document.createElement("div");

div.className="category";

div.innerHTML=`
<span>${cat.icon}</span>
${name}
`;

div.onclick=()=>openCategory(cat.id);

box.appendChild(div);

});

renderCategorySelect();

}
