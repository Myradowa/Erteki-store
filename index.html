<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Erteki 🛍️</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#faf8f1;color:#292929}
header{text-align:center;padding:20px 12px;background:linear-gradient(135deg,#fff,#fff3c4,#fff);border-bottom:2px solid #d4af37}
.logo{font-size:36px;font-weight:bold;color:#b8860b}
.subtitle{color:#777;font-size:13px;margin:5px}
.top{display:flex;justify-content:center;gap:8px;margin-top:14px}
button{cursor:pointer}
button,input,select,textarea{font-family:inherit}
.top button,.lang button,.back,.small{padding:9px 12px;border:1px solid #d4af37;border-radius:10px;background:#fff6d4;color:#765700;font-weight:bold}
.lang{margin-top:10px}.lang button{font-size:11px;margin:2px}.lang .active{background:#d4af37;color:white}
.search{padding:15px 10px}.search input,.admin input,.admin select,.admin textarea{width:100%;padding:12px;margin:5px 0;border:1px solid #d4af37;border-radius:12px;background:white}
.title{padding:10px 12px;color:#806000;font-size:19px;font-weight:bold}
.categories{display:flex;gap:8px;padding:0 10px 18px;overflow:auto}
.category{min-width:110px;padding:12px 7px;border:1px solid #d4af37;border-radius:16px;background:#fff5d4;color:#765700;font-weight:bold}
.category span{display:block;font-size:25px;margin-bottom:5px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 10px 20px}
.product,.box,.order{background:white;padding:12px;margin-bottom:12px;border:1px solid #ead9a0;border-radius:16px;box-shadow:0 3px 12px #0001}
.product img{width:100%;height:120px;object-fit:contain}.noimg{height:120px;display:flex;align-items:center;justify-content:center;background:#fff8dc;font-size:40px;border-radius:10px}
.product h3{font-size:13px;margin:7px 0}.product p{font-size:10px;color:#777}
.price{color:#b8860b;font-weight:bold}
.gold{width:100%;padding:10px;margin-top:7px;border:0;border-radius:9px;background:linear-gradient(110deg,#765300,#d4af37,#ffe68a,#d4af37,#765300);color:#fff;font-weight:bold}
.page,.admin{display:none;padding:15px 10px}
.qty{display:flex;justify-content:center;align-items:center;gap:12px;margin:10px}.qty button{width:36px;height:36px;border:1px solid #d4af37;border-radius:9px;background:#fff5ce;font-size:20px}
.remove{width:100%;padding:9px;border:0;border-radius:9px;background:#fff0f0;color:#a33}
.total{padding:15px;margin-bottom:10px;background:#fff3c4;border:1px solid #d4af37;border-radius:14px;font-weight:bold;color:#765700}
.empty{text-align:center;padding:35px;background:white;border-radius:16px;color:#888}
.notice{padding:11px;background:#fff8dc;border:1px solid #d4af37;border-radius:10px;margin:8px 0;font-size:13px}
.status{display:inline-block;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:bold}
.accepted{background:#fff3c4;color:#8a6d00}.onway{background:#dceeff;color:#07599e}.delivered{background:#dcf5e0;color:#187331}.cancelled{background:#ffe0e0;color:#a33}
.status-buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}.status-buttons button{padding:8px;border:1px solid #d4af37;border-radius:8px;background:white}
#toast{display:none;position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:1001;background:#2e9e4f;color:white;padding:13px 18px;border-radius:12px;font-weight:bold}
#newOrder{display:none;position:fixed;top:0;left:0;right:0;z-index:1000;background:#d4af37;color:white;padding:15px;text-align:center;font-weight:bold}
label{font-size:12px;font-weight:bold;color:#765700}
</style>
</head>

<body>

<div id="toast"></div>

<div id="newOrder">
🔔 Täze sargyt geldi!
<button onclick="takeOrders()">Sargydy almak</button>
</div>

<section id="home">
<header>
<div class="logo">Erteki ✨</div>
<div class="subtitle" id="subtitle">Türkmenistan üçin onlaýn söwda</div>

<div class="top">
<button onclick="openCart()">🛒 <span id="cartText">Sebet</span> <b id="count">0</b></button>
<button onclick="loginAdmin()">🔐 Admin</button>
</div>

<div class="lang">
<button id="tk" onclick="language='tk';render()">🇹🇲 TKM</button>
<button id="ru" onclick="language='ru';render()">🇷🇺 РУС</button>
</div>
</header>

<div class="search">
<input id="search" placeholder="🔍 Haryt gözle..." oninput="renderProducts()">
</div>

<div class="title" id="catTitle">Kategoriýalar</div>
<div id="categories" class="categories"></div>

<div class="title" id="popTitle">Meşhur harytlar</div>
<div id="products" class="products"></div>
</section>

<section id="cartPage" class="page">
<div class="title">🛒 <span id="cartTitle">Sebet</span></div>
<div id="cartItems"></div>
<div class="total">Jemi: <span id="total">0</span> TMT</div>
<button class="gold" onclick="openOrder()">📦 Sargyt et</button>
<button class="back" onclick="home()">← Yza</button>
</section>

<section id="orderPage" class="page">
<div class="title">📦 Sargyt maglumatlary</div>

<div class="box">
<input id="customerName" placeholder="Adyňyz">
<input id="customerPhone" placeholder="Telefon (+993XXXXXXXX)">
<input id="customerAddress" placeholder="Salgyňyz">

<label>📍 Welaýat</label>
<select id="region" onchange="deliveryInfo()"></select>

<div class="notice" id="delivery"></div>

<label>📝 Kuryer üçin bellik — hökmany däl</label>
<textarea id="note" rows="3"
placeholder="Meselem: Kuryer gelmezden 1 sagat öň jaň etsin"></textarea>

<button class="gold" onclick="sendOrder()">✅ Sargydy tassykla</button>
</div>

<button class="back" onclick="openCart()">← Sebede dolan</button>
</section>

<section id="adminPage" class="admin">

<div class="title">🔐 Admin panel</div>

<div class="box">
<h3>📍 Welaýatlar / Delivery</h3>
<div id="regions"></div>

<input id="newRegion" placeholder="Welaýatyň ady">
<input id="newPrice" type="number" placeholder="Delivery bahasy TMT">
<button class="small" onclick="addRegion()">➕ Goş</button>
</div>

<div class="box">
<h3>📂 Kategoriýa</h3>
<input id="catName" placeholder="Kategoriýanyň ady">
<input id="catIcon" placeholder="Emoji 🎁">
<button class="gold" onclick="addCategory()">Kategoriýa goş</button>
</div>

<div class="box">
<h3>➕ Haryt goş</h3>

<input id="pName" placeholder="Türkmençe ady">
<input id="pNameRu" placeholder="Rusça ady">
<input id="pPrice" type="number" placeholder="Bahasy">
<input id="pDesc" placeholder="Türkmençe düşündiriş">
<input id="pDescRu" placeholder="Rusça düşündiriş">

<select id="pCategory"></select>

<input id="pImage" type="file" accept="image/*" onchange="image(event)">

<img id="preview" style="display:none;width:100px;height:100px;object-fit:contain">

<button class="gold" onclick="addProduct()">✨ Haryt goş</button>
</div>

<div class="title">📦 Harytlar</div>
<div id="adminProducts"></div>

<div class="title">📋 Gelen sargytlar</div>
<div id="orders"></div>

<button class="back" onclick="home()">← Esasy sahypa</button>
</section>

<script>

const API=""; 
/*
  Worker URL-i şu ýere ýaz:
  https://erteki-api.YOUR-NAME.workers.dev
*/

const PASSWORD="1972ejemjan";

let language=localStorage.language||"tk";
let cart=[];
let imageData="";

let data={
categories:[],
products:[],
regions:[],
orders:[]
};

const defaultRegions=[
["Aşgabat",25],
["Ahal",25],
["Balkan",30],
["Daşoguz",30],
["Lebap",30],
["Mary",30]
];

function localLoad(){

data.categories=JSON.parse(localStorage.categories||"null")||[
{id:"gift",name:"Sowgatlar",ru:"Подарки",icon:"🎁"},
{id:"beauty",name:"Gözellik we saç",ru:"Красота и волосы",icon:"💇‍♀️"},
{id:"home",name:"Öý üçin harytlar",ru:"Товары для дома",icon:"🏠"}
];

data.products=JSON.parse(localStorage.products||"null")||[
{id:1,name:"Teddy Mişka 30sm",ru:"Мишка Тедди 30см",price:110,desc:"Sowgat üçin owadan mişka 🧸",descRu:"Красивая игрушка 🧸",category:"gift",image:""},
{id:2,name:"Owadan Suwenir",ru:"Красивый сувенир",price:65,desc:"Ajaýyp sowgatlyk suwenir ✨",descRu:"Красивый сувенир ✨",category:"gift",image:""},
{id:3,name:"Gije çyrasy Aý",ru:"Ночник Луна",price:90,desc:"Owadan gije çyrasy 🌙",descRu:"Красивая лунная лампа 🌙",category:"gift",image:""},
{id:4,name:"Saç üçin styler",ru:"Стайлер для волос",price:250,desc:"Saç üçin amatly",descRu:"Удобный стайлер",category:"beauty",image:""},
{id:5,name:"Fen-darak",ru:"Фен-расчёска",price:180,desc:"Saç düzmek üçin",descRu:"Для укладки волос",category:"beauty",image:""},
{id:6,name:"Termos",ru:"Термос",price:150,desc:"Gündelik ulanmak üçin",descRu:"Для ежедневного использования",category:"home",image:""}
];

data.regions=JSON.parse(localStorage.regions||"null")||
defaultRegions.map(x=>({name:x[0],price:x[1]}));

data.orders=JSON.parse(localStorage.orders||"[]");
}

function save(){

localStorage.categories=JSON.stringify(data.categories);
localStorage.products=JSON.stringify(data.products);
localStorage.regions=JSON.stringify(data.regions);
localStorage.orders=JSON.stringify(data.orders);

}

async function loadBackend(){

if(!API)return;

try{

let r=await fetch(API+"?type=data");
let x=await r.json();

if(x.categories)data.categories=x.categories;
if(x.products)data.products=x.products;
if(x.regions)data.regions=x.regions;
if(x.orders)data.orders=x.orders;

save();
render();

}catch(e){}

}

async function backend(body){

if(!API)return;

try{

await fetch(API,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(body)
});

}catch(e){}

}

function render(){

subtitle.textContent=
language==="tk"
?"Türkmenistan üçin onlaýn söwda"
:"Онлайн-магазин для Туркменистана";

search.placeholder=
language==="tk"
?"🔍 Haryt gözle..."
:"🔍 Поиск товара...";

cartText.textContent=
language==="tk"?"Sebet":"Корзина";

catTitle.textContent=
language==="tk"?"Kategoriýalar":"Категории";

popTitle.textContent=
language==="tk"?"Meşhur harytlar":"Популярные товары";

tk.classList.toggle("active",language==="tk");
ru.classList.toggle("active",language==="ru");

renderCategories();
renderProducts();
renderCart();
renderRegions();
renderAdminProducts();
renderOrders();
renderCategorySelect();

}

function renderCategories(){

categories.innerHTML=data.categories.map(c=>`

<button class="category" onclick="filterCategory('${c.id}')">

<span>${c.icon}</span>

${language==="tk"?c.name:c.ru}

</button>

`).join("");

}

function renderProducts(){

let q=search.value.toLowerCase();

products.innerHTML=data.products
.filter(p=>
(p.name+" "+p.ru).toLowerCase().includes(q)
)
.map(productCard).join("");

}

function productCard(p){

return `

<div class="product">

${p.image
?`<img src="${p.image}">`
:`<div class="noimg">🛍️</div>`}

<h3>${language==="tk"?p.name:p.ru}</h3>

<p>${language==="tk"?p.desc:p.descRu}</p>

<div class="price">${p.price} TMT</div>

<button class="gold"
onclick="addCart(${p.id})">

🛒 ${language==="tk"
?"Sebede goş"
:"Добавить в корзину"}

</button>

</div>

`;

}

function filterCategory(id){

let list=data.products.filter(p=>p.category===id);

products.innerHTML=list.map(productCard).join("");

}

function addCart(id){

let x=cart.find(a=>a.id===id);

if(x)x.qty++;
else cart.push({id,qty:1});

renderCart();

toast(
language==="tk"
?"Sebede goşuldy"
:"Добавлено"
);

}

function renderCart(){

count.textContent=cart.reduce((a,b)=>a+b.qty,0);

if(!cart.length){

cartItems.innerHTML=
`<div class="empty">🛒<br><br>${
language==="tk"?"Sebet boş":"Корзина пуста"
}</div>`;

total.textContent=0;

return;

}

let sum=0;

cartItems.innerHTML=cart.map(x=>{

let p=data.products.find(y=>y.id===x.id);

sum+=p.price*x.qty;

return `

<div class="box">

<b>${language==="tk"?p.name:p.ru}</b>

<br>${p.price} TMT

<div class="qty">

<button onclick="qty(${x.id},-1)">−</button>

<b>${x.qty}</b>

<button onclick="qty(${x.id},1)">+</button>

</div>

<button class="remove"
onclick="removeCart(${x.id})">

🗑 Aýyr

</button>

</div>

`;

}).join("");

total.textContent=sum;

}

function qty(id,n){

let x=cart.find(a=>a.id===id);

x.qty+=n;

if(x.qty<=0)
cart=cart.filter(a=>a.id!==id);

renderCart();

}

function removeCart(id){

cart=cart.filter(x=>x.id!==id);

renderCart();

}

function openCart(){

hide();

cartPage.style.display="block";

renderCart();

}

function openOrder(){

if(!cart.length){

toast("Sebet boş");

return;

}

hide();

orderPage.style.display="block";

renderRegionsSelect();

deliveryInfo();

}

function renderRegionsSelect(){

region.innerHTML=data.regions.map(r=>
`<option value="${r.name}">
${r.name} — ${r.price} TMT
</option>`
).join("");

}

function deliveryInfo(){

let r=data.regions.find(x=>x.name===region.value)||data.regions[0];

delivery.innerHTML=
`🚚 Kuryer <b>3 sagadyň dowamynda</b> barar.<br>
💰 Delivery: <b>${r.price} TMT</b>`;

}

async function sendOrder(){

if(
!customerName.value.trim()||
!customerPhone.value.trim()||
!customerAddress.value.trim()
){

toast("Ähli maglumatlary dolduryň");

return;

}

let r=data.regions.find(x=>x.name===region.value);

let items=cart.map(x=>{

let p=data.products.find(y=>y.id===x.id);

return{
name:p.name,
nameRu:p.ru,
price:p.price,
qty:x.qty
};

});

let productsTotal=items.reduce(
(a,x)=>a+x.price*x.qty,0
);

let order={

id:Date.now(),

customer:{
name:customerName.value,
phone:customerPhone.value,
address:customerAddress.value,
region:r.name,
note:note.value
},

items,

delivery:r.price,

total:productsTotal+r.price,

status:"accepted",

date:new Date().toLocaleString()

};

data.orders.unshift(order);

save();

await backend({
type:"order",
order
});

cart=[];

renderCart();

toast(
language==="tk"
?"Sargydyňyz üstünlikli kabul edildi!"
:"Ваш заказ успешно принят!"
);

home();

}

function loginAdmin(){

let p=prompt("Admin paroly:");

if(p===PASSWORD){

openAdmin();

}else if(p!==null){

toast("Parol nädogry");

}

}

function openAdmin(){

hide();

adminPage.style.display="block";

loadBackend();

}

function takeOrders(){

newOrder.style.display="none";

openAdmin();

}

function renderRegions(){

regions.innerHTML=data.regions.map((r,i)=>`

<div class="box">

<b>${r.name}</b>

<input
id="price${i}"
type="number"
value="${r.price}">

<button class="small"
onclick="updateRegion(${i})">

💾 Sakla

</button>

<button class="small"
onclick="deleteRegion(${i})">

🗑 Aýyr

</button>

</div>

`).join("");

}

async function updateRegion(i){

data.regions[i].price=
Number(document.getElementById("price"+i).value);

save();

await backend({
type:"saveRegions",
regions:data.regions
});

render();

}

async function deleteRegion(i){

data.regions.splice(i,1);

save();

await backend({
type:"saveRegions",
regions:data.regions
});

render();

}

async function addRegion(){

let n=newRegion.value.trim();

let p=Number(newPrice.value);

if(!n||p<0){

toast("Welaýat we delivery bahasyny ýazyň");

return;

}

data.regions.push({
name:n,
price:p
});

save();

await backend({
type:"saveRegions",
regions:data.regions
});

newRegion.value="";
newPrice.value="";

render();

}

function renderCategorySelect(){

pCategory.innerHTML=data.categories.map(c=>`

<option value="${c.id}">
${c.icon} ${language==="tk"?c.name:c.ru}
</option>

`).join("");

}

async function addCategory(){

let name=catName.value.trim();

if(!name){

toast("Kategoriýanyň adyny ýazyň");

return;

}

let c={
id:"c"+Date.now(),
name,
ru:name,
icon:catIcon.value||"📦"
};

data.categories.push(c);

save();

await backend({
type:"saveCategories",
categories:data.categories
});

catName.value="";
catIcon.value="";

render();

}

function image(e){

let file=e.target.files[0];

if(!file)return;

let reader=new FileReader();

reader.onload=function(){

imageData=reader.result;

preview.src=imageData;

preview.style.display="block";

};

reader.readAsDataURL(file);

}

async function addProduct(){

if(!pName.value||!pPrice.value){

toast("Harydyň adyny we bahasyny ýazyň");

return;

}

let p={

id:Date.now(),

name:pName.value,

ru:pNameRu.value||pName.value,

price:Number(pPrice.value),

desc:pDesc.value,

descRu:pDescRu.value||pDesc.value,

category:pCategory.value,

image:imageData

};

data.products.unshift(p);

save();

await backend({
type:"saveProducts",
products:data.products
});

["pName","pNameRu","pPrice","pDesc","pDescRu"]
.forEach(id=>document.getElementById(id).value="");

imageData="";

preview.style.display="none";

render();

}

async function deleteProduct(id){

data.products=data.products.filter(p=>p.id!==id);

save();

await backend({
type:"saveProducts",
products:data.products
});

render();

}

function renderAdminProducts(){

adminProducts.innerHTML=data.products.map(p=>`

<div class="box">

${p.image?`<img src="${p.image}" style="width:80px;height:80px;object-fit:contain">`:""}

<b>${p.name}</b>

<br>${p.price} TMT

<br>

<button class="small"
onclick="deleteProduct(${p.id})">

🗑 Aýyr

</button>

</div>

`).join("");

}

function renderOrders(){

if(!data.orders.length){

orders.innerHTML=
`<div class="empty">Häzirlikçe sargyt ýok.</div>`;

return;

}

orders.innerHTML=data.orders.map(o=>`

<div class="order">

<b>📦 Sargyt #${o.id}</b>

<br>👤 ${o.customer.name}

<br>📞 ${o.customer.phone}

<br>📍 ${o.customer.address}

<br>🏙️ ${o.customer.region}

<br>🚚 Delivery: ${o.delivery} TMT

<br>📝 ${
o.customer.note||"Bellik ýok"
}

<br>💰 <b>${o.total} TMT</b>

<br>

<span class="status ${o.status}">

${statusText(o.status)}

</span>

<div class="status-buttons">

<button onclick="changeStatus(${o.id},'accepted')">
✅ Kabul edildi
</button>

<button onclick="changeStatus(${o.id},'onway')">
🚚 Ýolda
</button>

<button onclick="changeStatus(${o.id},'delivered')">
📦 Gowşuryldy
</button>

<button onclick="changeStatus(${o.id},'cancelled')">
❌ Ýatyryldy
</button>

</div>

</div>

`).join("");

}

function statusText(s){

return{

accepted:"✅ Sargyt kabul edildi",

onway:"🚚 Ýolda",

delivered:"📦 Gowşuryldy",

cancelled:"❌ Ýatyryldy"

}[s];

}

async function changeStatus(id,status){

let o=data.orders.find(x=>x.id===id);

if(!o)return;

o.status=status;

save();

await backend({
type:"status",
id,
status
});

renderOrders();

}

function hide(){

home.style.display="none";

document.querySelectorAll(".page,.admin")
.forEach(x=>x.style.display="none");

}

function home(){

hide();

homeEl.style.display="block";

}

function toast(text){

toastEl.textContent=text;

toastEl.style.display="block";

setTimeout(()=>{
toastEl.style.display="none";
},2500);

}

async function checkOrders(){

if(!API)return;

try{

let r=await fetch(API+"?type=orders");

let x=await r.json();

if(x.orders){

let old=data.orders.length;

data.orders=x.orders;

save();

if(x.orders.length>old){

newOrder.style.display="block";

playSound();

}

}

}catch(e){}

}

function playSound(){

try{

let ctx=new AudioContext();

let osc=ctx.createOscillator();

let gain=ctx.createGain();

osc.connect(gain);

gain.connect(ctx.destination);

osc.frequency.value=800;

gain.gain.value=.15;

osc.start();

setTimeout(()=>osc.stop(),700);

}catch(e){}

}

const homeEl=document.getElementById("home");
const toastEl=document.getElementById("toast");

localLoad();

render();

setInterval(checkOrders,10000);

</script>

</body>
</html>
