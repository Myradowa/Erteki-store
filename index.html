<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Erteki ✨</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#faf8f1;
 color:#292929
}
header{
 padding:22px 12px;
 text-align:center;
 background:linear-gradient(135deg,#fff,#fff4c9,#fff);
 border-bottom:2px solid #d4af37
}
.logo{
 font-size:36px;
 font-weight:bold;
 color:#b8860b
}
.subtitle{color:#777;font-size:13px;margin-top:5px}
.top{display:flex;justify-content:center;margin-top:15px}
button{
 cursor:pointer;
 font-weight:bold
}
.top button,.lang button{
 padding:9px 13px;
 border:1px solid #d4af37;
 border-radius:20px;
 background:#fff8dc;
 color:#765700
}
.lang{margin-top:10px}
.lang button{font-size:11px;border-radius:9px}
.lang .active{background:#d4af37;color:white}

.search{padding:15px 10px}
input,select{
 width:100%;
 padding:12px;
 margin:5px 0;
 border:1px solid #d4af37;
 border-radius:12px;
 font-size:14px;
 background:white
}
.title{
 padding:10px 12px;
 color:#806000;
 font-size:19px;
 font-weight:bold
}
.line{
 width:40px;height:3px;
 background:#d4af37;
 margin-top:5px;
 border-radius:5px
}
.categories{
 display:flex;
 gap:8px;
 overflow-x:auto;
 padding:0 10px 18px
}
.category{
 min-width:115px;
 padding:12px 7px;
 border:1px solid #d4af37;
 border-radius:16px;
 background:#fff8dc;
 color:#765700;
 text-align:center
}
.category span{display:block;font-size:26px;margin-bottom:5px}

.products{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:9px;
 padding:0 10px 20px
}
.product,.box,.order{
 background:white;
 border:1px solid #ead9a0;
 border-radius:15px;
 padding:10px;
 margin-bottom:10px;
 box-shadow:0 3px 12px #0000000d
}
.product img{
 width:100%;
 height:120px;
 object-fit:contain;
 border-radius:10px
}
.product h3{font-size:14px;margin:7px 0 4px}
.product p{font-size:11px;color:#777}
.price{
 color:#b8860b;
 font-weight:bold;
 font-size:15px
}
.gold{
 width:100%;
 padding:11px;
 border:0;
 border-radius:10px;
 margin-top:7px;
 background:linear-gradient(110deg,#765300,#d4af37,#ffe68a,#d4af37,#765300);
 color:white
}
.page{display:none;padding:15px 10px}
.back{
 width:100%;
 padding:11px;
 margin-top:8px;
 border:1px solid #d4af37;
 border-radius:11px;
 background:white;
 color:#765700
}
.qty{
 display:flex;
 justify-content:center;
 align-items:center;
 gap:15px
}
.qty button{
 width:35px;height:35px;
 border:1px solid #d4af37;
 border-radius:9px;
 background:#fff5ce;
 font-size:18px
}
.remove{
 width:100%;
 padding:9px;
 margin-top:8px;
 border:0;
 border-radius:9px;
 background:#ffeaea;
 color:#a33
}
.total{
 padding:15px;
 background:#fff3c4;
 border:1px solid #d4af37;
 border-radius:14px;
 font-size:18px;
 font-weight:bold;
 color:#765700
}
#adminPage{display:none;padding:15px 10px}
.small{
 padding:8px 10px;
 border:1px solid #d4af37;
 border-radius:9px;
 background:#fff6d4;
 color:#765700
}
.status{
 padding:8px;
 border-radius:9px;
 background:#fff3c4;
 color:#765700;
 text-align:center;
 font-weight:bold;
 margin-top:8px
}
.status button{
 padding:7px;
 margin:3px;
 border:1px solid #d4af37;
 border-radius:8px;
 background:white
}
.empty{
 text-align:center;
 padding:30px;
 background:white;
 border-radius:15px;
 color:#888
}
#toast{
 position:fixed;
 top:15px;
 left:50%;
 transform:translateX(-50%);
 background:#2e9e4f;
 color:white;
 padding:12px 18px;
 border-radius:12px;
 display:none;
 z-index:9999
}
</style>
</head>

<body>

<div id="toast"></div>

<div id="home">

<header>
<div class="logo">Erteki ✨</div>
<div class="subtitle" id="subtitle">
Türkmenistan üçin onlaýn söwda
</div>

<div class="top">
<button onclick="openCart()">🛒 <span id="cartText">Sebet</span> (<span id="count">0</span>)</button>
</div>

<div class="lang">
<button id="tkBtn" onclick="setLang('tk')">🇹🇲 TKM</button>
<button id="ruBtn" onclick="setLang('ru')">🇷🇺 РУС</button>
<button onclick="adminLogin()">🔐 Admin</button>
</div>
</header>

<div class="search">
<input id="search"
placeholder="🔍 Haryt gözle..."
oninput="renderProducts()">
</div>

<div class="title">
<span id="catTitle">Kategoriýalar</span>
<div class="line"></div>
</div>

<div id="categories" class="categories"></div>

<div class="title">
<span id="popularTitle">Meşhur harytlar</span>
<div class="line"></div>
</div>

<div id="products" class="products"></div>

</div>


<div id="categoryPage" class="page">
<div class="title">
<span id="categoryName"></span>
<div class="line"></div>
</div>

<div id="categoryProducts" class="products"></div>

<button class="back" onclick="homePage()">← Yza</button>
</div>


<div id="cartPage" class="page">

<div class="title">🛒 Sebet<div class="line"></div></div>

<div id="cartItems"></div>

<div class="total">
Jemi: <span id="total">0</span> TMT
</div>

<button class="gold" onclick="openOrder()">
📦 Sargyt et
</button>

<button class="back" onclick="homePage()">← Yza</button>
</div>


<div id="orderPage" class="page">

<div class="title">
📦 Sargyt maglumatlary
<div class="line"></div>
</div>

<div class="box">

<input id="customerName" placeholder="Adyňyz">
<input id="customerPhone" placeholder="Telefon (+993XXXXXXXX)">
<input id="customerAddress" placeholder="Salgyňyz">

<button class="gold" onclick="sendOrder()">
✅ Sargydy tassykla
</button>

</div>

<button class="back" onclick="openCart()">
← Sebede dolan
</button>
</div>


<div id="adminPage">

<div class="title">
🔐 Admin panel
<div class="line"></div>
</div>

<div class="box">

<h3>📂 Kategoriýa goş</h3>

<input id="catName" placeholder="Türkmençe kategoriýa">
<input id="catNameRu" placeholder="Rusça kategoriýa">
<input id="catIcon" placeholder="Emoji 🎁">

<button class="gold" onclick="addCategory()">
➕ Kategoriýa goş
</button>

</div>

<div id="adminCategories"></div>


<div class="box">

<h3>➕ Haryt goş</h3>

<input id="pName" placeholder="Harydyň ady">
<input id="pNameRu" placeholder="Rusça ady">
<input id="pPrice" type="number" placeholder="Bahasy">
<input id="pDesc" placeholder="Türkmençe düşündiriş">
<input id="pDescRu" placeholder="Rusça düşündiriş">

<select id="pCategory"></select>

<input id="pImage" type="file" accept="image/*">

<button class="gold" onclick="addProduct()">
✨ Haryt goş
</button>

</div>

<div class="title">
📦 Harytlar
<div class="line"></div>
</div>

<div id="adminProducts"></div>

<div class="title">
📋 Gelen sargytlar
<div class="line"></div>
</div>

<div id="orders"></div>

<button class="back" onclick="homePage()">
← Esasy sahypa
</button>

</div>


<script>

const PASSWORD="1972ejemjan";

let lang=localStorage.getItem("lang")||"tk";

let categories=JSON.parse(
 localStorage.getItem("categories")
)||[
 {id:"gift",name:"Sowgatlar",nameRu:"Подарки",icon:"🎁"},
 {id:"beauty",name:"Gözellik we saç",nameRu:"Красота и волосы",icon:"💇‍♀️"},
 {id:"home",name:"Öý üçin",nameRu:"Для дома",icon:"🏠"}
];

let products=JSON.parse(
 localStorage.getItem("products")
)||[
 {
 id:1,
 name:"Teddy Mişka 30sm",
 nameRu:"Мишка Тедди 30см",
 price:110,
 desc:"Sowgat üçin owadan mişka 🧸",
 descRu:"Красивая игрушка для подарка 🧸",
 category:"gift",
 image:""
 },
 {
 id:2,
 name:"Owadan Suwenir",
 nameRu:"Красивый сувенир",
 price:65,
 desc:"Ajaýyp sowgatlyk suwenir ✨",
 descRu:"Красивый сувенир ✨",
 category:"gift",
 image:""
 },
 {
 id:3,
 name:"Gije çyrasy Aý",
 nameRu:"Ночник Луна",
 price:90,
 desc:"Aý şekilli gije çyrasy 🌙",
 descRu:"Красивый ночник 🌙",
 category:"gift",
 image:""
 }
];

let orders=JSON.parse(
 localStorage.getItem("orders")
)||[];

let cart=[];

function save(){
 localStorage.setItem("categories",JSON.stringify(categories));
 localStorage.setItem("products",JSON.stringify(products));
 localStorage.setItem("orders",JSON.stringify(orders));
}

function toast(text){
 let x=document.getElementById("toast");
 x.innerText=text;
 x.style.display="block";
 setTimeout(()=>x.style.display="none",2500);
}

function setLang(x){
 lang=x;
 localStorage.setItem("lang",x);

 document.getElementById("tkBtn")
 .classList.toggle("active",x==="tk");

 document.getElementById("ruBtn")
 .classList.toggle("active",x==="ru");

 document.getElementById("subtitle").innerText=
 x==="tk"
 ?"Türkmenistan üçin onlaýn söwda"
 :"Онлайн-магазин для Туркменистана";

 document.getElementById("cartText").innerText=
 x==="tk"?"Sebet":"Корзина";

 document.getElementById("catTitle").innerText=
 x==="tk"?"Kategoriýalar":"Категории";

 document.getElementById("popularTitle").innerText=
 x==="tk"?"Meşhur harytlar":"Популярные товары";

 document.getElementById("search").placeholder=
 x==="tk"?"🔍 Haryt gözle...":"🔍 Поиск товара...";

 renderCategories();
 renderProducts();
 renderCart();
}

function renderCategories(){

let el=document.getElementById("categories");

el.innerHTML=categories.map(c=>`

<div class="category"
onclick="openCategory('${c.id}')">

<span>${c.icon}</span>

${lang==="tk"?c.name:c.nameRu}

</div>

`).join("");
}

function renderProducts(){

let q=document.getElementById("search").value
.toLowerCase();

let list=products.filter(p=>{

let n=(lang==="tk"?p.name:p.nameRu).toLowerCase();

return n.includes(q);

});

let el=document.getElementById("products");

if(!list.length){

el.innerHTML=
`<div class="empty">Haryt tapylmady</div>`;

return;
}

el.innerHTML=list.map(productCard).join("");
}

function productCard(p){

let name=lang==="tk"?p.name:p.nameRu;
let desc=lang==="tk"?p.desc:p.descRu;

return `

<div class="product">

${
p.image
?
`<img src="${p.image}">`
:
`<div style="height:120px;display:flex;align-items:center;justify-content:center;font-size:45px">🛍️</div>`
}

<h3>${name}</h3>

<p>${desc}</p>

<div class="price">${p.price} TMT</div>

<button class="gold"
onclick="addCart(${p.id})">

🛒 ${lang==="tk"?"Sebede goş":"Добавить"}

</button>

</div>
`;
}

function addCart(id){

let found=cart.find(x=>x.id===id);

if(found) found.qty++;
else cart.push({id:id,qty:1});

updateCount();
toast(lang==="tk"?"Sebede goşuldy ✓":"Добавлено в корзину ✓");
}

function updateCount(){

document.getElementById("count").innerText=
cart.reduce((a,b)=>a+b.qty,0);
}

function openCart(){

hideAll();

document.getElementById("cartPage").style.display="block";

renderCart();
}

function renderCart(){

let el=document.getElementById("cartItems");

if(!cart.length){

el.innerHTML=
`<div class="empty">🛒<br><br>
${lang==="tk"?"Sebet boş":"Корзина пуста"}
</div>`;

document.getElementById("total").innerText=0;
return;
}

let total=0;

el.innerHTML=cart.map(item=>{

let p=products.find(x=>x.id===item.id);

if(!p)return"";

total+=p.price*item.qty;

return `

<div class="box">

<b>${lang==="tk"?p.name:p.nameRu}</b>

<div>${p.price} TMT</div>

<div class="qty">

<button onclick="changeQty(${p.id},-1)">−</button>

<span>${item.qty}</span>

<button onclick="changeQty(${p.id},1)">+</button>

</div>

<button class="remove"
onclick="removeCart(${p.id})">

${lang==="tk"?"Aýyr":"Удалить"}

</button>

</div>

`;

}).join("");

document.getElementById("total").innerText=total;
}

function changeQty(id,n){

let x=cart.find(a=>a.id===id);

if(!x)return;

x.qty+=n;

if(x.qty<=0)
cart=cart.filter(a=>a.id!==id);

updateCount();
renderCart();
}

function removeCart(id){

cart=cart.filter(a=>a.id!==id);

updateCount();
renderCart();
}

function openOrder(){

if(!cart.length){

toast(lang==="tk"?
"Sebet boş 🛒":
"Корзина пуста 🛒");

return;
}

hideAll();

document.getElementById("orderPage")
.style.display="block";
}

function sendOrder(){

let name=document.getElementById("customerName").value.trim();
let phone=document.getElementById("customerPhone").value.trim();
let address=document.getElementById("customerAddress").value.trim();

if(!name||!phone||!address){

toast(lang==="tk"?
"Ähli maglumatlary dolduryň":
"Заполните все поля");

return;
}

let items=cart.map(x=>{

let p=products.find(a=>a.id===x.id);

return{
 name:p.name,
 nameRu:p.nameRu,
 price:p.price,
 qty:x.qty
};

});

let total=items.reduce(
(a,b)=>a+b.price*b.qty,0
);

orders.unshift({

id:Date.now(),

name:name,
phone:phone,
address:address,

items:items,

total:total,

status:"accepted",

date:new Date().toLocaleString(),

seen:false

});

save();

cart=[];
updateCount();

document.getElementById("customerName").value="";
document.getElementById("customerPhone").value="";
document.getElementById("customerAddress").value="";

toast(lang==="tk"?
"Sargydyňyz üstünlikli kabul edildi! ✓":
"Ваш заказ успешно принят! ✓");

setTimeout(homePage,800);
}

function adminLogin(){

let password=prompt(
lang==="tk"?
"Admin parolyny giriziň:":
"Введите пароль администратора:"
);

if(password===PASSWORD){

hideAll();

document.getElementById("adminPage")
.style.display="block";

renderAdmin();

}else if(password!==null){

toast(lang==="tk"?
"Parol nädogry!":
"Неверный пароль!");

}
}

function renderAdmin(){

renderAdminCategories();
renderAdminProducts();
renderSelect();
renderOrders();
}

function addCategory(){

let name=document.getElementById("catName").value.trim();
let nameRu=document.getElementById("catNameRu").value.trim();
let icon=document.getElementById("catIcon").value.trim()||"📦";

if(!name){

toast("Kategoriýanyň adyny ýazyň");
return;
}

categories.push({

id:"cat_"+Date.now(),

name:name,

nameRu:nameRu||name,

icon:icon

});

save();

document.getElementById("catName").value="";
document.getElementById("catNameRu").value="";
document.getElementById("catIcon").value="";

renderAdmin();
renderCategories();

toast("Kategoriýa goşuldy ✓");
}

function renderAdminCategories(){

document.getElementById("adminCategories").innerHTML=
categories.map(c=>`

<div class="box">

<b>${c.icon} ${c.name}</b>

<br>

<button class="small"
onclick="deleteCategory('${c.id}')">

🗑️ Aýyr

</button>

</div>

`).join("");
}

function deleteCategory(id){

if(products.some(p=>p.category===id)){

toast("Bu kategoriýada haryt bar");
return;
}

categories=categories.filter(c=>c.id!==id);

save();
renderAdmin();
renderCategories();

toast("Kategoriýa aýryldy ✓");
}

function renderSelect(){

document.getElementById("pCategory").innerHTML=
categories.map(c=>
`<option value="${c.id}">
${c.name}
</option>`
).join("");
}

function addProduct(){

let name=document.getElementById("pName").value.trim();
let nameRu=document.getElementById("pNameRu").value.trim();
let price=Number(document.getElementById("pPrice").value);
let desc=document.getElementById("pDesc").value.trim();
let descRu=document.getElementById("pDescRu").value.trim();
let category=document.getElementById("pCategory").value;
let file=document.getElementById("pImage").files[0];

if(!name||!price||!category){

toast("Harydyň maglumatlaryny dolduryň");
return;
}

let product={

id:Date.now(),

name:name,

nameRu:nameRu||name,

price:price,

desc:desc,

descRu:descRu||desc,

category:category,

image:""

};

if(file){

let reader=new FileReader();

reader.onload=function(){

product.image=reader.result;

products.push(product);

save();
renderAdmin();
renderProducts();

};

reader.readAsDataURL(file);

}else{

products.push(product);

save();
renderAdmin();
renderProducts();
}

document.getElementById("pName").value="";
document.getElementById("pNameRu").value="";
document.getElementById("pPrice").value="";
document.getElementById("pDesc").value="";
document.getElementById("pDescRu").value="";
document.getElementById("pImage").value="";

toast("Haryt goşuldy ✓");
}

function renderAdminProducts(){

document.getElementById("adminProducts").innerHTML=
products.map(p=>`

<div class="box">

<b>${p.name}</b>

<div>${p.price} TMT</div>

<button class="small"
onclick="deleteProduct(${p.id})">

🗑️ Aýyr

</button>

</div>

`).join("");
}

function deleteProduct(id){

if(!confirm("Harydy aýyrmalymy?"))
return;

products=products.filter(p=>p.id!==id);

save();
renderAdmin();
renderProducts();

toast("Haryt aýryldy ✓");
}

function renderOrders(){

let el=document.getElementById("orders");

if(!orders.length){

el.innerHTML=
`<div class="empty">
Häzirlikçe sargyt ýok.
</div>`;

return;
}

el.innerHTML=orders.map(o=>`

<div class="order">

<b>📦 Sargyt #${String(o.id).slice(-6)}</b>

<br><br>

<b>Müşderi:</b> ${o.name}

<br>

<b>Telefon:</b> ${o.phone}

<br>

<b>Salgy:</b> ${o.address}

<br><br>

<b>Harytlar:</b>

${o.items.map(i=>
`<div>${i.name} × ${i.qty}</div>`
).join("")}

<br>

<b>Jemi:</b> ${o.total} TMT

<div class="status">

${statusText(o.status)}

<br>

<button onclick="changeStatus(${o.id},'accepted')">
Kabul edildi
</button>

<button onclick="changeStatus(${o.id},'onway')">
Ýolda
</button>

<button onclick="changeStatus(${o.id},'delivered')">
Gowşuryldy
</button>

<button onclick="changeStatus(${o.id},'cancelled')">
Ýatyryldy
</button>

</div>

<br>

<small>${o.date}</small>

</div>

`).join("");
}

function statusText(s){

if(lang==="ru"){

return{
accepted:"✅ Заказ принят",
onway:"🚚 В пути",
delivered:"📦 Доставлен",
cancelled:"❌ Отменён"
}[s];

}

return{
accepted:"✅ Sargyt kabul edildi",
onway:"🚚 Ýolda",
delivered:"📦 Gowşuryldy",
cancelled:"❌ Ýatyryldy"
}[s];
}

function changeStatus(id,status){

let o=orders.find(x=>x.id===id);

if(!o)return;

o.status=status;

save();
renderOrders();

toast(
lang==="tk"?
"Sargydyň ýagdaýy üýtgedildi ✓":
"Статус заказа изменён ✓"
);
}

function openCategory(id){

let c=categories.find(x=>x.id===id);

if(!c)return;

hideAll();

document.getElementById("categoryPage")
.style.display="block";

document.getElementById("categoryName")
.innerText=
lang==="tk"?c.name:c.nameRu;

let list=products.filter(
p=>p.category===id
);

document.getElementById("categoryProducts")
.innerHTML=list.length?
list.map(productCard).join("")
:
`<div class="empty">
${lang==="tk"?
"Bu kategoriýada haryt ýok":
"В этой категории пока нет товаров"}
</div>`;
}

function homePage(){

hideAll();

document.getElementById("home")
.style.display="block";

renderCategories();
renderProducts();
}

function hideAll(){

document.getElementById("home").style.display="none";
document.getElementById("categoryPage").style.display="none";
document.getElementById("cartPage").style.display="none";
document.getElementById("orderPage").style.display="none";
document.getElementById("adminPage").style.display="none";
}

setLang(lang);
updateCount();

</script>

</body>
</html>
