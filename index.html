<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Erteki 🛍️</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#faf8f1;
 color:#292929
}

header{
 padding:20px 12px;
 text-align:center;
 background:linear-gradient(135deg,#fff,#fff4c9,#fff);
 border-bottom:2px solid #d4af37;
 box-shadow:0 5px 25px #c9a22730
}

.logo{
 font-size:36px;
 font-weight:bold;
 background:linear-gradient(90deg,#765300,#d4af37,#fff0a0,#d4af37,#765300);
 -webkit-background-clip:text;
 color:transparent
}

.subtitle{
 color:#777;
 margin-top:5px;
 font-size:13px
}

.top{
 display:flex;
 justify-content:center;
 gap:8px;
 margin-top:14px
}

.top button{
 padding:10px 13px;
 border:1px solid #c9a227;
 border-radius:25px;
 background:#fff8dc;
 color:#765700;
 font-weight:bold
}

.lang{
 margin-top:10px
}

.lang button{
 padding:7px 10px;
 border:1px solid #d4af37;
 border-radius:9px;
 background:#fff6d4;
 color:#765700;
 margin:2px;
 font-size:11px
}

.lang button.active{
 background:#d4af37;
 color:#fff
}

.search{
 padding:15px 10px
}

.search input,
.admin input,
.admin select{
 width:100%;
 padding:12px;
 border:1px solid #d4af37;
 border-radius:12px;
 background:white;
 font-size:14px;
 margin:5px 0
}

.field-error{
 display:none;
 color:#c0392b;
 font-size:11px;
 font-weight:bold;
 margin:-2px 0 6px 4px
}

.field-error.show{
 display:block
}

input.invalid{
 border-color:#c0392b;
 background:#fff5f5
}

input.valid{
 border-color:#3a9d4a
}

.title{
 padding:8px 12px;
 color:#806000;
 font-size:19px;
 font-weight:bold
}

.line{
 width:40px;
 height:3px;
 margin-top:5px;
 background:#d4af37;
 border-radius:5px
}

.categories{
 display:flex;
 gap:8px;
 padding:0 10px 18px;
 overflow-x:auto
}

.category{
 min-width:110px;
 padding:12px 7px;
 text-align:center;
 border:1px solid #d4af37;
 border-radius:16px;
 background:linear-gradient(145deg,#fff,#fff5d4);
 color:#765700;
 font-weight:bold;
 font-size:12px
}

.category span{
 display:block;
 font-size:25px;
 margin-bottom:5px
}

.products{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
 padding:0 10px 20px
}

.product{
 background:white;
 padding:8px;
 border-radius:12px;
 border:1px solid #ead9a0;
 box-shadow:0 3px 10px #0000000d;
 overflow:hidden
}

.product img{
 width:90px;
 height:90px;
 object-fit:contain;
 border-radius:10px;
 display:block;
 margin:0 auto;
 background:#fff
}

.no-image{
 width:90px;
 height:90px;
 margin:0 auto;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:10px;
 background:#fff8dc;
 font-size:35px
}

.product h3{
 margin:6px 0 3px;
 font-size:13px;
 line-height:1.2
}

.product p{
 color:#777;
 font-size:10px;
 margin:3px 0;
 line-height:1.3
}

.price{
 color:#b8860b;
 font-size:14px;
 font-weight:bold
}

.gold{
 width:100%;
 padding:8px 3px;
 margin-top:6px;
 border:0;
 border-radius:9px;
 background:linear-gradient(110deg,#765300,#c9a227,#ffe68a,#c9a227,#765300);
 color:white;
 font-size:10px;
 font-weight:bold
}

.gold:disabled{
 opacity:.8
}

.page{
 display:none;
 padding:15px 10px
}

.cart-item,
.admin-box,
.admin-product,
.order{
 background:white;
 padding:14px;
 margin-bottom:12px;
 border:1px solid #ead9a0;
 border-radius:16px;
 box-shadow:0 4px 15px #0000000a
}

.qty{
 display:flex;
 align-items:center;
 justify-content:center;
 gap:12px;
 margin-top:10px
}

.qty button{
 width:36px;
 height:36px;
 border:1px solid #d4af37;
 border-radius:9px;
 background:#fff5ce;
 font-size:19px
}

.qty span{
 min-width:25px;
 text-align:center;
 font-weight:bold
}

.remove{
 width:100%;
 padding:9px;
 margin-top:9px;
 border:0;
 border-radius:9px;
 background:#fff0f0;
 color:#a33
}

.total{
 padding:15px;
 border-radius:14px;
 background:#fff3c4;
 border:1px solid #d4af37;
 font-size:18px;
 font-weight:bold;
 color:#765700;
 margin-bottom:10px
}

.back{
 width:100%;
 padding:11px;
 margin-top:8px;
 border:1px solid #d4af37;
 border-radius:12px;
 background:white;
 color:#765700;
 font-weight:bold
}

.admin{
 display:none;
 padding:15px 10px
}

.admin-product img{
 width:90px;
 height:90px;
 object-fit:contain;
 display:block;
 margin:auto;
 border-radius:12px
}

.small{
 padding:8px 10px;
 border:1px solid #d4af37;
 border-radius:9px;
 background:#fff6d4;
 color:#765700;
 margin-top:5px;
 font-size:11px
}

.empty{
 text-align:center;
 padding:35px 15px;
 background:white;
 border:1px solid #ead9a0;
 border-radius:16px;
 color:#888
}

.status{
 margin-top:10px;
 padding:9px;
 border-radius:9px;
 background:#fff3c4;
 color:#765700;
 font-weight:bold;
 text-align:center;
 font-size:13px
}

/* --- order status badges --- */

.status-badge{
 display:inline-block;
 padding:6px 12px;
 border-radius:20px;
 font-size:12px;
 font-weight:bold;
 margin:6px 0
}

.status-accepted{background:#fff3c4;color:#8a6d00}
.status-onway{background:#dceeff;color:#0b5aa3}
.status-delivered{background:#dcf5e0;color:#1e7d34}
.status-cancelled{background:#ffe0e0;color:#a33}

.status-buttons{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:6px;
 margin-top:10px
}

.status-btn{
 padding:9px 4px;
 border:1px solid #d4af37;
 border-radius:9px;
 background:#fff;
 color:#555;
 font-size:11px;
 font-weight:bold
}

.status-btn.current{
 border:2px solid #765700;
 background:#fff3c4;
 color:#765700
}

/* --- toast notifications --- */

#toastBox{
 position:fixed;
 top:14px;
 left:50%;
 transform:translateX(-50%);
 z-index:999;
 display:flex;
 flex-direction:column;
 gap:8px;
 width:92%;
 max-width:360px;
 pointer-events:none
}

.toast{
 display:flex;
 align-items:center;
 gap:8px;
 padding:12px 14px;
 border-radius:12px;
 font-size:13px;
 font-weight:bold;
 color:#fff;
 box-shadow:0 6px 20px #0000002a;
 opacity:0;
 transform:translateY(-12px);
 transition:all .25s ease
}

.toast.show{
 opacity:1;
 transform:translateY(0)
}

.toast.success{background:linear-gradient(120deg,#2e9e4f,#3fbf67)}
.toast.error{background:linear-gradient(120deg,#c0392b,#e0564a)}

.toast .icon{
 font-size:17px
}

/* --- confirm modal --- */

#confirmOverlay{
 display:none;
 position:fixed;
 inset:0;
 background:#00000060;
 z-index:998;
 align-items:center;
 justify-content:center
}

#confirmOverlay.show{
 display:flex
}

.confirm-box{
 background:#fff;
 width:85%;
 max-width:320px;
 border-radius:16px;
 padding:20px;
 text-align:center;
 box-shadow:0 10px 40px #00000040
}

.confirm-box p{
 font-size:14px;
 color:#333;
 margin:0 0 16px
}

.confirm-actions{
 display:flex;
 gap:10px
}

.confirm-actions button{
 flex:1;
 padding:11px 4px;
 border:0;
 border-radius:10px;
 font-weight:bold;
 font-size:14px
}

.confirm-yes{
 background:linear-gradient(110deg,#2e9e4f,#3fbf67);
 color:#fff
}

.confirm-no{
 background:#f1f1f1;
 color:#555
}

/* --- new order banner --- */

#newOrderBanner{
 display:none;
 position:fixed;
 top:0;
 left:0;
 right:0;
 z-index:1000;
 padding:16px 14px;
 background:linear-gradient(110deg,#765300,#c9a227,#ffe68a,#c9a227,#765300);
 background-size:200% 100%;
 color:#fff;
 text-align:center;
 box-shadow:0 6px 20px #00000040;
 animation:bannerGlow 1.4s ease-in-out infinite
}

#newOrderBanner.show{
 display:block
}

#newOrderBanner .bell{
 font-size:22px;
 display:inline-block;
 animation:bellRing .5s ease-in-out infinite
}

#newOrderBanner .headline{
 font-size:16px;
 font-weight:bold;
 margin-top:4px
}

#newOrderBanner .detail{
 font-size:12px;
 margin-top:3px;
 opacity:.95
}

@keyframes bannerGlow{
 0%{background-position:0% 50%}
 50%{background-position:100% 50%}
 100%{background-position:0% 50%}
}

@keyframes bellRing{
 0%,100%{transform:rotate(0)}
 25%{transform:rotate(-15deg)}
 75%{transform:rotate(15deg)}
}

.admin-badge{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 min-width:17px;
 height:17px;
 padding:0 4px;
 margin-left:4px;
 border-radius:10px;
 background:#e0362b;
 color:#fff;
 font-size:10px;
 font-weight:bold;
 vertical-align:top
}
</style>
</head>

/* ================= VALIDATION ================= */

function countLetters(str){

let matches=str.match(/\p{L}/gu);

return matches ? matches.length : 0;

}


function validateName(live){

let el=document.getElementById("customerName");
let err=document.getElementById("nameError");

let value=el.value.trim();

let ok=countLetters(value)>=3;

if(!ok){

err.innerText=t("nameTooShort");

if(live && value.length===0){

err.classList.remove("show");
el.classList.remove("invalid","valid");

}else{

err.classList.add("show");
el.classList.add("invalid");
el.classList.remove("valid");

}

}else{

err.classList.remove("show");
el.classList.remove("invalid");
el.classList.add("valid");

}

return ok;

}


function validatePhone(live){

let el=document.getElementById("customerPhone");
let err=document.getElementById("phoneError");

let raw=el.value.trim();

let cleaned=raw.replace(/[\s-()]/g,"");

let ok=/^\+993\d{8}$/.test(cleaned);

if(!ok){

err.innerText=t("phoneInvalid");

if(live && raw.length===0){

err.classList.remove("show");
el.classList.remove("invalid","valid");

}else{

err.classList.add("show");
el.classList.add("invalid");
el.classList.remove("valid");

}

}else{

err.classList.remove("show");
el.classList.remove("invalid");
el.classList.add("valid");

}

return ok;

}


function validateAddress(live){

let el=document.getElementById("customerAddress");
let err=document.getElementById("addressError");

let value=el.value.trim();

let ok=value.length>0;

if(!ok){

err.innerText=t("addressEmpty");

if(live){

err.classList.remove("show");
el.classList.remove("invalid","valid");

}else{

err.classList.add("show");
el.classList.add("invalid");
el.classList.remove("valid");

}

}else{

err.classList.remove("show");
el.classList.remove("invalid");
el.classList.add("valid");

}

return ok;

}

/* ================= NEW ORDER NOTIFICATION ================= */

let audioCtx=null;

function unlockAudio(){

if(!audioCtx){

try{

audioCtx=new (window.AudioContext || window.webkitAudioContext)();

}catch(e){

audioCtx=null;

}

}

if(audioCtx && audioCtx.state==="suspended"){

audioCtx.resume();

}

}

document.addEventListener("click",unlockAudio,{once:true});

document.addEventListener("touchstart",unlockAudio,{once:true});


function playNotificationSound(){

unlockAudio();

if(!audioCtx)return;

let now=audioCtx.currentTime;

/* two-tone chime, similar in spirit to a classic SMS alert */

let notes=[

{freq:1318.51,start:0,dur:0.14},
{freq:1567.98,start:0.15,dur:0.22}

];


notes.forEach(n=>{

let osc=audioCtx.createOscillator();

let gain=audioCtx.createGain();

osc.type="sine";

osc.frequency.value=n.freq;

gain.gain.setValueAtTime(0,now+n.start);

gain.gain.linearRampToValueAtTime(0.35,now+n.start+0.015);

gain.gain.exponentialRampToValueAtTime(0.0001,now+n.start+n.dur);

osc.connect(gain);

gain.connect(audioCtx.destination);

osc.start(now+n.start);

osc.stop(now+n.start+n.dur+0.02);

});

}

/* cross-tab: if another tab/device sharing this browser places an order,
   pick it up here and alert whoever currently has the shop open */

window.addEventListener("storage",e=>{

if(e.key!=="orders")return;

let updated=JSON.parse(e.newValue)||[];

let hadIds=new Set(orders.map(o=>o.id));

let freshOrders=updated.filter(o=>!hadIds.has(o.id));

orders=updated;

updateAdminBadge();

if(document.getElementById("adminPage").style.display==="block"){

renderOrders();

}

if(freshOrders.length){

let newest=freshOrders[freshOrders.length-1];

playNotificationSound();

showNewOrderBanner(newest);

}

});


/* ================= TOAST ================= */

function showToast(type,message){

let box=document.getElementById("toastBox");

let toast=document.createElement("div");

toast.className="toast "+type;

let icon=type==="success" ? "✓" : "✕";

toast.innerHTML=`<span class="icon">${icon}</span><span>${message}</span>`;

box.appendChild(toast);

requestAnimationFrame(()=>{

toast.classList.add("show");

});

setTimeout(()=>{

toast.classList.remove("show");

setTimeout(()=>{

toast.remove();

},300);

},2200);

}


/* ================= CONFIRM MODAL ================= */

function showConfirm(message,onYes,onNo){

let overlay=document.getElementById("confirmOverlay");

document.getElementById("confirmText").innerText=message;

overlay.classList.add("show");

let yesBtn=document.getElementById("confirmYesBtn");
let noBtn=document.getElementById("confirmNoBtn");

let cleanup=()=>{

overlay.classList.remove("show");

yesBtn.onclick=null;
noBtn.onclick=null;

};

yesBtn.onclick=()=>{

cleanup();

if(onYes)onYes();

};

noBtn.onclick=()=>{

cleanup();

if(onNo)onNo();

};

}
