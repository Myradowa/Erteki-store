<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Erteki 🛍️</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#faf8f1;
  color:#292929;
}

button,input,select,textarea{font-family:inherit}

header{
  padding:20px 12px;
  text-align:center;
  background:linear-gradient(135deg,#fff,#fff4c9,#fff);
  border-bottom:2px solid #d4af37;
  box-shadow:0 5px 25px #c9a22730;
}

.logo{
  font-size:36px;
  font-weight:bold;
  background:linear-gradient(90deg,#765300,#d4af37,#fff0a0,#d4af37,#765300);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.subtitle{
  color:#777;
  margin-top:5px;
  font-size:13px;
}

.top{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:14px;
  flex-wrap:wrap;
}

.top button{
  padding:10px 13px;
  border:1px solid #c9a227;
  border-radius:25px;
  background:#fff8dc;
  color:#765700;
  font-weight:bold;
  cursor:pointer;
}

.lang{margin-top:10px}

.lang button{
  padding:7px 10px;
  border:1px solid #d4af37;
  border-radius:9px;
  background:#fff6d4;
  color:#765700;
  margin:2px;
  font-size:11px;
  cursor:pointer;
}

.lang button.active{
  background:#d4af37;
  color:#fff;
}

.search{padding:15px 10px}

.search input{
  width:100%;
  padding:12px;
  border:1px solid #d4af37;
  border-radius:12px;
  background:white;
  font-size:14px;
  outline:none;
}

.search input:focus{
  box-shadow:0 0 0 3px #d4af3720;
}

.title{
  padding:8px 12px;
  color:#806000;
  font-size:19px;
  font-weight:bold;
}

.line{
  width:40px;
  height:3px;
  margin-top:5px;
  background:#d4af37;
  border-radius:5px;
}

.categories{
  display:flex;
  gap:8px;
  padding:0 10px 18px;
  overflow-x:auto;
}

.category{
  min-width:110px;
  padding:12px 7px;
  text-align:center;
  border:1px solid #d4af37;
  border-radius:16px;
  background:linear-gradient(145deg,#fff,#fff5d4);
  color:#765700;
  font-weight:bold;
  font-size:12px;
  cursor:pointer;
}

.category span{
  display:block;
  font-size:25px;
  margin-bottom:5px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  padding:0 10px 20px;
}

.product{
  background:white;
  padding:8px;
  border-radius:12px;
  border:1px solid #ead9a0;
  box-shadow:0 3px 10px #0000000d;
  overflow:hidden;
}

.product img{
  width:100%;
  height:130px;
  object-fit:contain;
  border-radius:10px;
  display:block;
  margin:0 auto;
  background:#fff;
}

.no-image{
  width:100%;
  height:130px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:#fff8dc;
  font-size:45px;
}

.product h3{
  margin:7px 0 3px;
  font-size:13px;
  line-height:1.2;
}

.product p{
  color:#777;
  font-size:10px;
  margin:3px 0;
  line-height:1.3;
  min-height:27px;
}

.price{
  color:#b8860b;
  font-size:14px;
  font-weight:bold;
}

.gold{
  width:100%;
  padding:10px 3px;
  margin-top:7px;
  border:0;
  border-radius:9px;
  background:linear-gradient(110deg,#765300,#c9a227,#ffe68a,#c9a227,#765300);
  color:white;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
}

.gold:active{transform:scale(.98)}

.page{
  display:none;
  padding:15px 10px;
}

.cart-item,
.admin-box,
.admin-product,
.order{
  background:white;
  padding:14px;
  margin-bottom:12px;
  border:1px solid #ead9a0;
  border-radius:16px;
  box-shadow:0 4px 15px #0000000a;
}

.qty{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-top:10px;
}

.qty button{
  width:36px;
  height:36px;
  border:1px solid #d4af37;
  border-radius:9px;
  background:#fff5ce;
  font-size:19px;
  cursor:pointer;
}

.qty span{
  min-width:25px;
  text-align:center;
  font-weight:bold;
}

.remove{
  width:100%;
  padding:9px;
  margin-top:9px;
  border:0;
  border-radius:9px;
  background:#fff0f0;
  color:#a33;
  cursor:pointer;
}

.total{
  padding:15px;
  border-radius:14px;
  background:#fff3c4;
  border:1px solid #d4af37;
  font-size:18px;
  font-weight:bold;
  color:#765700;
  margin-bottom:10px;
}

.back{
  width:100%;
  padding:11px;
  margin-top:8px;
  border:1px solid #d4af37;
  border-radius:12px;
  background:white;
  color:#765700;
  font-weight:bold;
  cursor:pointer;
}

.admin{
  display:none;
  padding:15px 10px;
}

.admin input,
.admin select,
.admin textarea,
.admin-box input,
.admin-box select,
.admin-box textarea{
  width:100%;
  padding:12px;
  border:1px solid #d4af37;
  border-radius:12px;
  background:white;
  font-size:14px;
  margin:5px 0;
  outline:none;
}

.admin textarea,
.admin-box textarea{
  min-height:80px;
  resize:vertical;
}

.admin-product img{
  width:90px;
  height:90px;
  object-fit:contain;
  display:block;
  margin:auto;
  border-radius:12px;
}

.small{
  padding:8px 10px;
  border:1px solid #d4af37;
  border-radius:9px;
  background:#fff6d4;
  color:#765700;
  margin-top:5px;
  font-size:11px;
  cursor:pointer;
}

.danger{
  border-color:#d66;
  background:#fff0f0;
  color:#a33;
}

.empty{
  text-align:center;
  padding:35px 15px;
  background:white;
  border:1px solid #ead9a0;
  border-radius:16px;
  color:#888;
}

.status-badge{
  display:inline-block;
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  margin:6px 0;
}

.status-accepted{
  background:#fff3c4;
  color:#8a6d00;
}

.status-onway{
  background:#dceeff;
  color:#0b5aa3;
}

.status-delivered{
  background:#dcf5e0;
  color:#1e7d34;
}

.status-cancelled{
  background:#ffe0e0;
  color:#a33;
}

.status-buttons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
  margin-top:10px;
}

.status-btn{
  padding:9px 4px;
  border:1px solid #d4af37;
  border-radius:9px;
  background:#fff;
  color:#555;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
}

.status-btn.current{
  border:2px solid #765700;
  background:#fff3c4;
  color:#765700;
}

#toastBox{
  position:fixed;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  z-index:9999;
  display:flex;
  flex-direction:column;
  gap:8px;
  width:92%;
  max-width:360px;
  pointer-events:none;
}

.toast{
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px 14px;
  border-radius:12px;
  font-size:13px;
  font-weight:bold;
  color:#fff;
  box-shadow:0 6px 20px #0000002a;
  opacity:0;
  transform:translateY(-12px);
  transition:all .25s ease;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

.toast.success{
  background:linear-gradient(120deg,#2e9e4f,#3fbf67);
}

.toast.error{
  background:linear-gradient(120deg,#c0392b,#e0564a);
}

#confirmOverlay{
  display:none;
  position:fixed;
  inset:0;
  background:#00000060;
  z-index:9998;
  align-items:center;
  justify-content:center;
}

#confirmOverlay.show{display:flex}

.confirm-box{
  background:#fff;
  width:85%;
  max-width:320px;
  border-radius:16px;
  padding:20px;
  text-align:center;
  box-shadow:0 10px 40px #00000040;
}

.confirm-box p{
  font-size:14px;
  color:#333;
  margin:0 0 16px;
}

.confirm-actions{
  display:flex;
  gap:10px;
}

.confirm-actions button{
  flex:1;
  padding:11px 4px;
  border:0;
  border-radius:10px;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
}

.confirm-yes{
  background:linear-gradient(110deg,#2e9e4f,#3fbf67);
  color:#fff;
}

.confirm-no{
  background:#f1f1f1;
  color:#555;
}

#newOrderBanner{
  display:none;
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:10000;
  padding:16px 14px;
  background:linear-gradient(110deg,#765300,#c9a227,#ffe68a,#c9a227,#765300);
  color:#fff;
  text-align:center;
  box-shadow:0 6px 20px #00000040;
}

#newOrderBanner.show{display:block}

#newOrderBanner .bell{font-size:22px}

#newOrderBanner .headline{
  font-size:16px;
  font-weight:bold;
  margin-top:4px;
}

#newOrderBanner .detail{
  font-size:12px;
  margin-top:3px;
}

.admin-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:17px;
  height:17px;
  padding:0 4px;
  margin-left:4px;
  border-radius:10px;
  background:#e0362b;
  color:#fff;
  font-size:10px;
  font-weight:bold;
}

.delivery-info{
  padding:12px;
  margin:10px 0;
  border:1px solid #d4af37;
  border-radius:14px;
  background:#fff8dc;
  color:#765700;
  font-size:13px;
  line-height:1.6;
}

.note-box{
  padding:10px;
  border-radius:12px;
  background:#f8f8f8;
  margin-top:8px;
  font-size:12px;
}

.field-error{
  color:#c0392b;
  font-size:11px;
  min-height:14px;
  margin-left:4px;
}

.checkbox-row{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 0;
  font-size:13px;
}

.checkbox-row input{
  width:auto;
  margin:0;
}

.admin-section-title{
  color:#765700;
  margin-top:8px;
}

.order-item{
  padding:7px 0;
  border-bottom:1px solid #eee;
  font-size:12px;
}

.order-item:last-child{border-bottom:0}

.region-card{
  background:white;
  padding:12px;
  border:1px solid #ead9a0;
  border-radius:14px;
  margin-bottom:8px;
}

@media(max-width:380px){
  .products{
    grid-template-columns:repeat(2,1fr);
  }

  .logo{font-size:31px}
}
</style>
</head>

<body>

<div id="toastBox"></div>

<div id="newOrderBanner" onclick="dismissBannerAndOpenAdmin()">
  <div class="bell">🔔</div>
  <div class="headline" id="newOrderHeadline">Täze sargyt geldi!</div>
  <div class="detail" id="newOrderDetail"></div>
</div>

<div id="confirmOverlay">
  <div class="confirm-box">
    <p id="confirmText"></p>

    <div class="confirm-actions">
      <button class="confirm-yes" id="confirmYesBtn">✓ Hawa</button>
      <button class="confirm-no" id="confirmNoBtn">✕ Ýok</button>
    </div>
  </div>
</div>

<div id="home">

Türkmenistan üçin onlaýn söwda

<span id="adminBadge" class="admin-badge" style="display:none">0</span>
</button>

</div>

<div class="lang">

<button id="langTkBtn" onclick="setLanguage('tk')">
🇹🇲 TKM
</button>

<button id="langRuBtn" onclick="setLanguage('ru')">
🇷🇺 РУС
</button>

</div>

</header>

<div class="search">
<input

placeholder="🔍 Haryt gözle..."

Kategoriýalar

</div>

</div>


<div id="cartPage" class="page">

</div>

</div>

<button class="gold" onclick="openOrder()">
📦 Sargyt et
</button>

<button class="back" onclick="homePage()">
← Yza
</button>

</div>


<div id="orderPage" class="page">

<div class="title">
📦
<span id="orderPageTitle">Sargyt maglumatlary</span>
<div class="line"></div>
</div>

<div class="admin-box">

<input
id="customerName"
placeholder="Adyňyz"
oninput="validateName(true)">

<div class="field-error" id="nameError"></div>

<input
id="customerPhone"
placeholder="Telefon belgiňiz (+993XXXXXXXX)"
oninput="validatePhone(true)">

<div class="field-error" id="phoneError"></div>

<input
id="customerAddress"
placeholder="Salgyňyz"
oninput="validateAddress(true)">

<div class="field-error" id="addressError"></div>

<textarea
id="customerNote"

<div class="delivery-info">

💰 <span id="deliveryPriceLabel">Dostawka:</span>
<b id="customerDeliveryPrice">25</b> TMT
</div>

<button class="gold" onclick="sendOrder()">
✅ Sargydy tassykla
</button>

</div>

<button class="back" onclick="openCart()">
← Sebede dolan
</button>

</div>


<div id="adminPage" class="admin">

<div class="title">
🔐 <span id="adminTitleText">Admin panel</span>
<div class="line"></div>
</div>


<div class="admin-box">

<h3 class="admin-section-title">📍 Welaýatlar we dostawka</h3>

<input
id="regionName"
placeholder="Welaýatyň ady">

<input
id="regionPrice"
type="number"
placeholder="Dostawka bahasy">

<button class="gold" onclick="addRegion()">
➕ Welaýat goş
</button>

</div>

<div id="adminRegions"></div>


<div class="admin-box">

<h3 class="admin-section-title">📂 Kategoriýa goş</h3>

<input
id="catName"
placeholder="Kategoriýanyň ady">

<input
id="catNameRu"
placeholder="Rusça kategoriýa ady">

<input
id="catIcon"
placeholder="Emoji mysal: 🎁">

<button class="gold" onclick="addCategory()">
➕ Kategoriýa goş
</button>

</div>

<div id="adminCategories"></div>


<div class="admin-box">

<h3 class="admin-section-title">➕ Haryt goş</h3>

<input
id="pName"
placeholder="Harydyň ady (Türkmençe)">

<input
id="pNameRu"
placeholder="Rusça ady">

<input
id="pPrice"
type="number"
placeholder="Bahasy">

<textarea
id="pDescription"
placeholder="Türkmençe düşündiriş"></textarea>

<textarea
id="pDescriptionRu"
placeholder="Rusça düşündiriş"></textarea>

<select id="pCategory"></select>

<input
id="pImage"
type="file"
accept="image/*"
onchange="readImage(event)">

<img
id="preview"
style="display:none;width:90px;height:90px;object-fit:contain;border-radius:12px;margin:8px auto">

<button class="gold" onclick="addProduct()">
✨ Haryt goş
</button>

</div>


<div class="title">
📦 Harytlar
<div class="line"></div>
</div>

<div id="adminProducts"></div>


<div class="title">
📋 Gelen sargytlar
<div class="line"></div>
</div>

<div id="orders"></div>


<button class="back" onclick="homePage()">
← Esasy sahypa
</button>

</div>

/* =========================
   TOAST
========================= */

function toast(message){
  const old = document.querySelector(".erteki-toast");

  if(old) old.remove();

  const el = document.createElement("div");
  el.className = "erteki-toast";
  el.textContent = message;

  document.body.appendChild(el);

  setTimeout(() => {
    el.remove();
  }, 2500);
  }
/* =========================
   PRODUCTS
========================= */

function renderProducts(){

  const container =
    document.getElementById("products");

  if(!container) return;

  container.innerHTML = "";

  products.forEach(product => {

    const name =
      currentLanguage === "ru"
        ? product.nameRu
        : product.name;

    const description =
      currentLanguage === "ru"
        ? product.descriptionRu
        : product.description;

    const card = document.createElement("div");

    card.className = "product-card";

    card.innerHTML = `
      <div class="product-image">
        ${
          product.image
            ? `<img src="${product.image}" alt="${name}">`
            : `<span>🛍️</span>`
        }
      </div>

      <h3>${name}</h3>

      <p>${description}</p>

      <strong>${product.price} TMT</strong>

      <button onclick="addToCart(${product.id})">
        ${tr("addCart")}
      </button>
    `;

    container.appendChild(card);
  });
}
