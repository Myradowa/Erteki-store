<!doctype html><html lang="tk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Erteki ✨</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#faf8f1;color:#292929}button,input,select,textarea{font:inherit}header{padding:20px 12px;text-align:center;background:linear-gradient(135deg,#fff,#fff4c9,#fff);border-bottom:2px solid #d4af37}.logo{font-size:36px;font-weight:bold;color:#b8860b}.subtitle{color:#777;font-size:13px}.top{display:flex;justify-content:center;gap:8px;margin-top:14px}.top button,.lang button,.small,.back{padding:9px 12px;border:1px solid #d4af37;border-radius:10px;background:#fff8dc;color:#765700;font-weight:bold}.lang{margin-top:10px}.lang button.active{background:#d4af37;color:white}.search{padding:15px 10px}.search input,.admin input,.admin select,.admin textarea,.order input,.order textarea,.order select{width:100%;padding:12px;margin:5px 0;border:1px solid #d4af37;border-radius:12px;background:white}.title{padding:8px 12px;color:#806000;font-size:19px;font-weight:bold}.line{width:40px;height:3px;margin-top:5px;background:#d4af37;border-radius:5px}.categories{display:flex;gap:8px;padding:0 10px 18px;overflow:auto}.category{min-width:110px;padding:12px 7px;text-align:center;border:1px solid #d4af37;border-radius:16px;background:#fff5d4;color:#765700;font-weight:bold;font-size:12px}.category span{display:block;font-size:25px}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 10px 20px}.product,.box,.order{background:white;padding:10px;border:1px solid #ead9a0;border-radius:14px;box-shadow:0 3px 12px #0001}.product img,.preview{width:100%;height:120px;object-fit:contain;border-radius:10px;background:#fff8dc}.product h3{font-size:13px;margin:7px 0}.product p{font-size:10px;color:#777}.price{color:#b8860b;font-weight:bold}.gold{width:100%;padding:10px;margin-top:6px;border:0;border-radius:10px;background:linear-gradient(110deg,#765300,#d4af37,#ffe68a,#d4af37,#765300);color:#fff;font-weight:bold}.page,.admin{display:none;padding:15px 10px}.qty{display:flex;justify-content:center;align-items:center;gap:12px}.qty button{width:38px;height:38px;border:1px solid #d4af37;border-radius:9px;background:#fff5ce}.remove{width:100%;padding:9px;border:0;border-radius:9px;background:#fff0f0;color:#a33;margin-top:8px}.total{padding:15px;border-radius:14px;background:#fff3c4;border:1px solid #d4af37;font-size:18px;font-weight:bold;color:#765700;margin:10px 0}.back{width:100%;margin-top:8px}.status-badge{display:inline-block;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:bold}.accepted{background:#fff3c4;color:#8a6d00}.onway{background:#dceeff;color:#0b5aa3}.delivered{background:#dcf5e0;color:#1e7d34}.cancelled{background:#ffe0e0;color:#a33}.status-buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}.status-btn{padding:9px 4px;border:1px solid #d4af37;border-radius:9px;background:#fff;font-size:11px;font-weight:bold}.status-btn.current{background:#fff3c4;border:2px solid #765700}.empty{text-align:center;padding:30px;color:#888}.admin-lock{max-width:360px;margin:40px auto}.note{background:#fff8dc;border:1px solid #d4af37;padding:10px;border-radius:10px;font-size:12px}.switch{display:flex;gap:8px;align-items:center;font-size:13px}.danger{background:#ffe0e0!important;color:#a33!important}.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99;background:#2e9e4f;color:#fff;padding:12px 16px;border-radius:12px;display:none;font-weight:bold}.toast.show{display:block}.admin-badge{background:#e0362b;color:#fff;border-radius:10px;padding:2px 6px;font-size:10px}
</style></head><body><div id="toast" class="toast"></div><div id="home"><header><div class="logo">Erteki ✨</div><div class="subtitle" id="subtitle"></div><div class="top"><button onclick="openCart()">🛒 <span id="cartText"></span> <b id="count">0</b></button><button onclick="openAdmin()">🔐 <span id="adminText">Admin</span><span id="badge"></span></button></div><div class="lang"><button id="tk" onclick="setLang('tk')">🇹🇲 TKM</button><button id="ru" onclick="setLang('ru')">🇷🇺 РУС</button></div></header><div class="search"><input id="search" oninput="renderProducts()"></div><div class="title" id="catTitle"></div><div id="categories" class="categories"></div><div class="title" id="popTitle"></div><div id="products" class="products"></div></div>
<div id="cartPage" class="page"><div class="title">🛒 <span data-t="cart"></span><div class="line"></div></div><div id="cartItems"></div><div class="total">Jemi: <span id="total">0</span> TMT</div><button class="gold" onclick="openOrder()">📦 Sargyt et</button><button class="back" onclick="homePage()">← Yza</button></div>
<div id="orderPage" class="page"><div class="title">📦 Sargyt maglumatlary<div class="line"></div></div><div class="box"><input id="name"><input id="phone" placeholder="+993XXXXXXXX"><input id="address"><select id="region" onchange="updateDelivery()"></select><div class="note" id="deliveryInfo"></div><textarea id="note" rows="3"></textarea><label class="switch"><input type="checkbox" id="callBefore"> <span id="callText"></span></label><button class="gold" onclick="sendOrder()">✅ Sargydy tassykla</button></div><button class="back" onclick="openCart()">← Sebede dolan</button></div>
<div id="adminPage" class="admin"><div id="adminLock" class="admin-lock box"><h3>🔐 Admin</h3><input id="adminPass" type="password" placeholder="Parol"><button class="gold" onclick="loginAdmin()">Girmek</button></div><div id="adminPanel" style="display:none"><div class="title">🔐 Admin panel<div class="line"></div></div><div class="box"><h3>📍 Welaýat / dostawka</h3><input id="regionName" placeholder="Welaýat ady"><input id="regionFee" type="number" placeholder="Dostawka TMT"><button class="gold" onclick="addRegion()">➕ Gosh</button><div id="regionList"></div></div><div class="box"><h3>📂 Kategoriýa</h3><input id="catName" placeholder="Kategoriýanyň ady"><input id="catIcon" placeholder="🎁"><button class="gold" onclick="addCategory()">➕ Gosh</button></div><div class="box"><h3>➕ Haryt</h3><input id="pName" placeholder="Türkmençe ady"><input id="pNameRu" placeholder="Rusça ady"><input id="pPrice" type="number" placeholder="Bahasy"><input id="pDesc" placeholder="Düşündiriş"><select id="pCat"></select><input id="pImage" type="file" accept="image/*" onchange="readImage(event)"><img id="preview" class="preview" style="display:none"><button class="gold" onclick="addProduct()">✨ Haryt goş</button></div><div class="title">📦 Harytlar<div class="line"></div></div><div id="adminProducts"></div><div class="title">📋 Sargytlar <span id="orderBadge"></span><div class="line"></div></div><div id="orders"></div><button class="back" onclick="homePage()">← Esasy sahypa</button></div></div>
<script>
const PASS='1972ejemjan';const S={tk:{subtitle:'Türkmenistan üçin onlaýn söwda',cart:'Sebet',admin:'Admin',search:'🔍 Haryt gözle...',cats:'Kategoriýalar',pop:'Meşhur harytlar',name:'Adyňyz',address:'Salgyňyz',note:'Sargyt üçin bellik (hökmany däl)',call:'Kuryer gelmezinden 1 sagat öň jaň etsin',delivery:'Kuryer 3 sagadyň dowamynda barar'},ru:{subtitle:'Онлайн-магазин для Туркменистана',cart:'Корзина',admin:'Админ',search:'🔍 Поиск товара...',cats:'Категории',pop:'Популярные товары',name:'Ваше имя',address:'Ваш адрес',note:'Примечание к заказу (необязательно)',call:'Позвонить за 1 час до приезда курьера',delivery:'Курьер приедет в течение 3 часов'}};
let lang=localStorage.lang||'tk',cart=[],imageData='';let cats=JSON.parse(localStorage.cats||'null')||[{id:'gift',name:'Sowgatlar',nameRu:'Подарки',icon:'🎁'},{id:'beauty',name:'Gözellik we saç',nameRu:'Красота и волосы',icon:'💇‍♀️'},{id:'home',name:'Öý üçin harytlar',nameRu:'Товары для дома',icon:'🏠'}];let products=JSON.parse(localStorage.products||'null')||[{id:1,name:'Teddy Mişka 30sm',nameRu:'Мишка Тедди 30см',price:110,desc:'Sowgat üçin owadan mişka 🧸',cat:'gift',image:''},{id:2,name:'Owadan Suwenir',nameRu:'Красивый сувенир',price:65,desc:'Ajaýyp sowgatlyk suwenir ✨',cat:'gift',image:''}];let regions=JSON.parse(localStorage.regions||'null')||[{name:'Aşgabat',fee:25}];let orders=JSON.parse(localStorage.orders||'[]');
const save=()=>{localStorage.cats=JSON.stringify(cats);localStorage.products=JSON.stringify(products);localStorage.regions=JSON.stringify(regions);localStorage.orders=JSON.stringify(orders)};const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setLang(x){lang=x;localStorage.lang=x;renderAll()}function t(k){return S[lang][k]||k}function renderAll(){subtitle.textContent=t('subtitle');cartText.textContent=t('cart');adminText.textContent=t('admin');search.placeholder=t('search');catTitle.textContent=t('cats');popTitle.textContent=t('pop');name.placeholder=t('name');address.placeholder=t('address');note.placeholder=t('note');callText.textContent=t('call');tk.classList.toggle('active',lang==='tk');ru.classList.toggle('active',lang==='ru');renderCats();renderProducts();renderSelect();renderCart();updateDelivery();renderRegions();renderAdminProducts();renderOrders();updateBadges()}
function renderCats(){categories.innerHTML=cats.map(c=>`<button class="category" onclick="filterCat('${c.id}')"><span>${c.icon}</span>${esc(lang==='tk'?c.name:c.nameRu)}</button>`).join('')}function filterCat(id){search.value='';renderProducts(id)}function renderProducts(cat){let q=search.value.toLowerCase();let arr=products.filter(p=>(!cat||p.cat===cat)&&((p.name+' '+p.nameRu+' '+p.desc).toLowerCase().includes(q)));productsEl.innerHTML=arr.length?arr.map(p=>`<div class="product">${p.image?`<img src="${p.image}">`:'<div style="height:120px;display:grid;place-items:center;font-size:45px;background:#fff8dc">🛍️</div>'}<h3>${esc(lang==='tk'?p.name:p.nameRu)}</h3><p>${esc(p.desc)}</p><div class="price">${p.price} TMT</div><button class="gold" onclick="addCart(${p.id})">🛒 ${lang==='tk'?'Sebede goş':'Добавить'}</button></div>`).join(''):'<div class="empty">Haryt ýok</div>'}const productsEl=document.getElementById('products');
function addCart(id){let p=products.find(x=>x.id===id);let x=cart.find(x=>x.id===id);x?x.qty++:cart.push({id,qty:1});navigator.vibrate?.(120);renderCart();toast('✓');}
function renderCart(){count.textContent=cart.reduce((a,x)=>a+x.qty,0);cartItems.innerHTML=cart.length?cart.map(x=>{let p=products.find(p=>p.id===x.id);return `<div class="box"><b>${esc(lang==='tk'?p.name:p.nameRu)}</b><div>${p.price} TMT</div><div class="qty"><button onclick="qty(${p.id},-1)">−</button><b>${x.qty}</b><button onclick="qty(${p.id},1)">+</button></div><button class="remove" onclick="qty(${p.id},-${x.qty})">Aýyr</button></div>`}).join(''):'<div class="empty">🛒<br>Sebet boş</div>';let sum=cart.reduce((a,x)=>a+(products.find(p=>p.id===x.id)?.price||0)*x.qty,0);total.textContent=sum}
function qty(id,n){let x=cart.find(x=>x.id===id);if(!x)return;x.qty+=n;if(x.qty<=0)cart=cart.filter(y=>y.id!==id);renderCart()}function show(id){document.querySelectorAll('#home,#cartPage,#orderPage,#adminPage').forEach(x=>x.style.display='none');document.getElementById(id).style.display=id==='home'?'block':'block'}function homePage(){show('home')}function openCart(){renderCart();show('cartPage')}function openOrder(){if(!cart.length)return toast('Sebet boş');renderSelect();show('orderPage')}
function renderSelect(){region.innerHTML=regions.map(r=>`<option value="${esc(r.name)}">${esc(r.name)} — ${r.fee} TMT</option>`).join('')}function updateDelivery(){let r=regions.find(x=>x.name===region.value)||regions[0];deliveryInfo.textContent=`${t('delivery')} — ${r?.fee||0} TMT`}
function sendOrder(){let r=regions.find(x=>x.name===region.value)||regions[0];if(!name.value.trim()||!phone.value.trim()||!address.value.trim())return toast('Maglumatlary dolduryň');let items=cart.map(x=>{let p=products.find(p=>p.id===x.id);return {name:p.name,nameRu:p.nameRu,qty:x.qty,price:p.price}});let totalSum=items.reduce((a,x)=>a+x.qty*x.price,0)+(r?.fee||0);orders.unshift({id:Date.now(),name:name.value,phone:phone.value,address:address.value,region:r?.name||'',fee:r?.fee||0,note:note.value,callBefore:callBefore.checked,items,total:totalSum,status:'accepted',seen:false,date:new Date().toLocaleString()});save();cart=[];renderCart();toast('Sargydyňyz kabul edildi!');homePage();}
function openAdmin(){show('adminPage');if(sessionStorage.admin==='1'||localStorage.adminRemember==='1'){adminLock.style.display='none';adminPanel.style.display='block';renderAll()}}function loginAdmin(){if(adminPass.value===PASS){sessionStorage.admin='1';localStorage.adminRemember='1';adminLock.style.display='none';adminPanel.style.display='block';renderAll();toast('Admin açyldy')}else toast('Parol ýalňyş')}
function addRegion(){let n=regionName.value.trim(),f=Number(regionFee.value);if(!n||f<0)return toast('Dogry maglumat giriziň');regions.push({name:n,fee:f});save();regionName.value=regionFee.value='';renderAll()}function renderRegions(){regionList.innerHTML=regions.map((r,i)=>`<div class="box">${esc(r.name)} — <b>${r.fee} TMT</b> <button class="small danger" onclick="regions.splice(${i},1);save();renderAll()">Aýyr</button></div>`).join('')}
function addCategory(){let n=catName.value.trim();if(!n)return toast('Kategoriýa adyny ýazyň');cats.push({id:'c'+Date.now(),name:n,nameRu:n,icon:catIcon.value||'📦'});save();catName.value=catIcon.value='';renderAll()}function readImage(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{imageData=r.result;preview.src=imageData;preview.style.display='block'};r.readAsDataURL(f)}function addProduct(){let n=pName.value.trim(),pr=Number(pPrice.value);if(!n||!pr)return toast('Harydyň adyny we bahasyny giriziň');products.push({id:Date.now(),name:n,nameRu:pNameRu.value||n,price:pr,desc:pDesc.value||'',cat:pCat.value,image:imageData});imageData='';save();pName.value=pNameRu.value=pPrice.value=pDesc.value='';preview.style.display='none';renderAll()}
function renderSelect(){pCat.innerHTML=cats.map(c=>`<option value="${c.id}">${esc(lang==='tk'?c.name:c.nameRu)}</option>`).join('');region.innerHTML=regions.map(r=>`<option value="${esc(r.name)}">${esc(r.name)} — ${r.fee} TMT</option>`).join('')}
function renderAdminProducts(){adminProducts.innerHTML=products.map(p=>`<div class="box"><b>${esc(p.name)}</b> — ${p.price} TMT <button class="small danger" onclick="delProduct(${p.id})">Aýyr</button></div>`).join('')}function delProduct(id){products=products.filter(p=>p.id!==id);save();renderAll()}
function statusText(s){return {accepted:'✅ Sargyt kabul edildi',onway:'🚚 Ýolda',delivered:'📦 Gowşuryldy',cancelled:'❌ Ýatyryldy'}[s]}function renderOrders(){ordersEl.innerHTML=orders.length?orders.map(o=>`<div class="order"><b>#${o.id}</b><br>👤 ${esc(o.name)}<br>📞 ${esc(o.phone)}<br>📍 ${esc(o.address)}, ${esc(o.region)}<br>📝 ${esc(o.note||'—')}<br>⏰ ${o.callBefore?'1 sagat öň jaň':'Jaň gerek däl'}<br>💰 <b>${o.total} TMT</b><br><span class="status-badge ${o.status}">${statusText(o.status)}</span><div class="status-buttons">${['accepted','onway','delivered','cancelled'].map(s=>`<button class="status-btn ${o.status===s?'current':''}" onclick="setStatus(${o.id},'${s}')">${statusText(s)}</button>`).join('')}</div></div>`).join(''):'<div class="empty">Sargyt ýok</div>'}function setStatus(id,s){let o=orders.find(x=>x.id===id);if(o){o.status=s;save();renderOrders();toast('✓ Status üýtgedildi')}}function updateBadges(){let n=orders.filter(o=>!o.seen).length;badge.textContent=n?' '+n:'';orderBadge.textContent=n?'🔴 '+n:''}
function toast(x){toastEl.textContent=x;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1800)}const toastEl=document.getElementById('toast'),ordersEl=document.getElementById('orders');
renderAll();show('home');
</script></body></html>
